      - main [ref=f4e211]:
        - heading "Alta de cuenta y membresía" [level=1] [ref=f4e214]
        - generic [ref=f4e216]:
          - generic [ref=f4e217]:
            - paragraph [ref=f4e218]: Este proceso comienza en la app, continúa en la sección que revisa la solicitud y termina cuando la membresía queda activa.
            - generic [ref=f4e219]:
              - heading "Resultado esperado" [level=2] [ref=f4e220]
              - link "Sección titulada «Resultado esperado»" [ref=f4e221] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f4e226]: La persona conserva una sola cuenta, completa su perfil, recibe la inscripción anual correspondiente y entra a la sección correcta con una membresía aprobada.
            - generic [ref=f4e227]:
              - heading "No confundas cuenta y membresía" [level=2] [ref=f4e228]
              - link "Sección titulada «No confundas cuenta y membresía»" [ref=f4e229] [cursor=pointer]:
                - /url: "#no-confundas-cuenta-y-membresía"
            - paragraph [ref=f4e234]: "SACDIA maneja registros distintos:"
            - list [ref=f4e235]:
              - listitem [ref=f4e236]:
                - strong [ref=f4e237]: "Cuenta:"
                - text: identidad con correo y contraseña que permite autenticarse.
              - listitem [ref=f4e238]:
                - strong [ref=f4e239]: "Post-registro:"
                - text: foto, datos personales y selección territorial.
              - listitem [ref=f4e240]:
                - strong [ref=f4e241]: "Inscripción anual:"
                - text: vínculo de la persona con una clase progresiva durante el año eclesiástico.
              - listitem [ref=f4e242]:
                - strong [ref=f4e243]: "Membresía:"
                - text: asignación de miembro dentro de una sección, inicialmente
                - code [ref=f4e244]: pending
                - text: .
            - paragraph [ref=f4e245]: Una persona puede iniciar sesión y tener inscripción anual mientras su membresía sigue pendiente. En ese estado ve el tablero restringido, pero no las funciones operativas del club.
            - generic [ref=f4e246]:
              - heading "Participantes" [level=2] [ref=f4e247]
              - link "Sección titulada «Participantes»" [ref=f4e248] [cursor=pointer]:
                - /url: "#participantes"
            - list [ref=f4e253]:
              - listitem [ref=f4e254]: Persona solicitante.
              - listitem [ref=f4e255]: Dirección, subdirección o secretaría de la sección cuando su cargo incluye la revisión.
              - listitem [ref=f4e256]: Personal administrativo para excepciones de cuenta o alcance, no como aprobación global de todos los usuarios.
              - listitem [ref=f4e257]: SACDIA, que deriva clase, controla estados y vence pendientes.
            - generic [ref=f4e258]:
              - heading "Matriz de responsabilidades" [level=2] [ref=f4e259]
              - link "Sección titulada «Matriz de responsabilidades»" [ref=f4e260] [cursor=pointer]:
                - /url: "#matriz-de-responsabilidades"
            - table [ref=f4e265]:
              - rowgroup [ref=f4e266]:
                - row [ref=f4e267]:
                  - columnheader "Etapa" [ref=f4e268]
                  - columnheader "Persona solicitante" [ref=f4e269]
                  - columnheader "Revisor de la sección" [ref=f4e270]
                  - columnheader "Sistema" [ref=f4e271]
              - rowgroup [ref=f4e272]:
                - row [ref=f4e273]:
                  - cell "Cuenta" [ref=f4e274]
                  - cell "Captura datos reales y conserva el correo." [ref=f4e275]
                  - cell "No crea otra cuenta por la persona." [ref=f4e276]
                  - cell "Crea identidad y sesión." [ref=f4e277]
                - row [ref=f4e278]:
                  - cell "Perfil inicial" [ref=f4e279]
                  - cell "Carga foto, datos, contactos y selección correcta." [ref=f4e280]
                  - cell "Orienta sin pedir contraseñas ni datos médicos por canales externos." [ref=f4e281]
                  - cell "Valida los tres pasos." [ref=f4e282]
                - row [ref=f4e283]:
                  - cell "Inscripción anual" [ref=f4e284]
                  - cell "Revisa la clase mostrada." [ref=f4e285]
                  - cell "Corrige excepciones por el proceso autorizado." [ref=f4e286]
                  - cell "Deriva clase por edad/tipo y crea o reactiva el registro anual." [ref=f4e287]
                - row [ref=f4e288]:
                  - cell "Membresía" [ref=f4e289]
                  - cell "Espera, cancela o vuelve a solicitar con la misma cuenta." [ref=f4e290]
                  - cell [ref=f4e291]:
                    - text: Aprueba o rechaza con
                    - code [ref=f4e292]: club_members:approve
                    - text: en su alcance.
                  - cell [ref=f4e293]:
                    - text: Crea la asignación
                    - code [ref=f4e294]: pending
                    - text: ", notifica y actualiza permisos."
            - generic [ref=f4e295]:
              - heading "Flujo completo" [level=2] [ref=f4e296]
              - link "Sección titulada «Flujo completo»" [ref=f4e297] [cursor=pointer]:
                - /url: "#flujo-completo"
            - list [ref=f4e302]:
              - listitem [ref=f4e303]: La persona crea una cuenta con nombre, apellidos, correo y contraseña.
              - listitem [ref=f4e304]: La app inicia la sesión y abre el post-registro.
              - listitem [ref=f4e305]: La persona carga la foto requerida.
              - listitem [ref=f4e306]: Captura género, nacimiento, bautismo, al menos un contacto y representante legal si es menor.
              - listitem [ref=f4e307]: Declara alergias, enfermedades y medicamentos, incluso cuando no tiene ninguno.
              - listitem [ref=f4e308]: Selecciona país, unión, campo local, club y sección.
              - listitem [ref=f4e309]:
                - text: SACDIA deriva la clase para el año eclesiástico y crea o reactiva la
                - strong [ref=f4e310]: inscripción anual
                - text: .
              - listitem [ref=f4e311]:
                - text: En la misma operación crea la membresía como
                - code [ref=f4e312]: pending
                - text: ", con vencimiento inicial de 8 días."
              - listitem [ref=f4e313]: SACDIA notifica a los cargos revisores configurados de la sección.
              - listitem [ref=f4e314]:
                - text: Una persona con
                - code [ref=f4e315]: club_members:approve
                - text: confirma la sección y aprueba o rechaza.
              - listitem [ref=f4e316]: La persona actualiza o vuelve a entrar en la app para recibir el estado nuevo.
            - paragraph [ref=f4e317]: La notificación puede llegar a dirección, subdirección, secretaría o secretaría-tesorería, pero el permiso efectivo y el alcance de sección son la autorización final.
            - generic [ref=f4e318]:
              - heading "Estados de la solicitud" [level=2] [ref=f4e319]
              - link "Sección titulada «Estados de la solicitud»" [ref=f4e320] [cursor=pointer]:
                - /url: "#estados-de-la-solicitud"
            - paragraph [ref=f4e325]:
              - text: La ruta esperada es
              - code [ref=f4e326]: pending
              - text: →
              - code [ref=f4e327]: active
              - text: .
            - table [ref=f4e328]:
              - rowgroup [ref=f4e329]:
                - row [ref=f4e330]:
                  - columnheader "Estado" [ref=f4e331]
                  - columnheader "Quién lo produce" [ref=f4e332]
                  - columnheader "Qué debe ocurrir después" [ref=f4e333]
              - rowgroup [ref=f4e334]:
                - row [ref=f4e335]:
                  - cell [ref=f4e336]:
                    - code [ref=f4e337]: pending
                  - cell "SACDIA al finalizar el paso 3." [ref=f4e338]
                  - cell "La sección revisa antes del vencimiento." [ref=f4e339]
                - row [ref=f4e340]:
                  - cell [ref=f4e341]:
                    - code [ref=f4e342]: active
                  - cell "Revisor autorizado." [ref=f4e343]
                  - cell "Se habilitan superficies según cargo y permisos." [ref=f4e344]
                - row [ref=f4e345]:
                  - cell [ref=f4e346]:
                    - code [ref=f4e347]: rejected
                  - cell "Revisor autorizado." [ref=f4e348]
                  - cell "La persona lee el motivo, corrige y vuelve a solicitar." [ref=f4e349]
                - row [ref=f4e350]:
                  - cell [ref=f4e351]:
                    - code [ref=f4e352]: cancelled
                  - cell "Persona solicitante." [ref=f4e353]
                  - cell "Se reabre la selección de club y sección." [ref=f4e354]
                - row [ref=f4e355]:
                  - cell [ref=f4e356]:
                    - code [ref=f4e357]: expired
                  - cell "Proceso automático." [ref=f4e358]
                  - cell "La persona vuelve a solicitar desde la app." [ref=f4e359]
            - paragraph [ref=f4e360]:
              - text: Los pendientes vencen según
              - code [ref=f4e361]: membership.pending_timeout_days
              - text: ; el valor predeterminado es 8 días y la revisión automática se ejecuta cada hora.
            - generic [ref=f4e362]:
              - heading "Corregir sin duplicar" [level=2] [ref=f4e363]
              - link "Sección titulada «Corregir sin duplicar»" [ref=f4e364] [cursor=pointer]:
                - /url: "#corregir-sin-duplicar"
            - list [ref=f4e369]:
              - listitem [ref=f4e370]: "Club o sección equivocados: cancela la solicitud pendiente y repite solo el paso 3."
              - listitem [ref=f4e371]:
