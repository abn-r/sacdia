                - /url: "#paso-3-club-sección-y-clase"
            - list [ref=f3e309]:
              - listitem [ref=f3e310]:
                - text: Selecciona
                - strong [ref=f3e311]: País
                - text: .
              - listitem [ref=f3e312]:
