      - main [ref=f3e213]:
        - heading "Completar el perfil inicial" [level=1] [ref=f3e216]
        - generic [ref=f3e218]:
          - generic [ref=f3e219]:
            - paragraph [ref=f3e220]: El post-registro aparece después de crear una cuenta o al iniciar sesión con un perfil incompleto. La app retoma automáticamente el primer paso pendiente.
            - generic [ref=f3e221]:
              - heading "Resultado esperado" [level=2] [ref=f3e222]
              - link "Sección titulada «Resultado esperado»" [ref=f3e223] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f3e228]: Tendrás una foto, datos personales suficientes, al menos un contacto de emergencia y una solicitud de membresía vinculada al club y sección correctos.
            - generic [ref=f3e229]:
              - heading "Quién puede utilizarlo" [level=2] [ref=f3e230]
              - link "Sección titulada «Quién puede utilizarlo»" [ref=f3e231] [cursor=pointer]:
                - /url: "#quién-puede-utilizarlo"
            - paragraph [ref=f3e236]: Usuarios autenticados cuyo post-registro todavía no está completo. Cada persona completa su propia información; un cargo administrativo no debe reemplazar este recorrido salvo una corrección autorizada.
            - generic [ref=f3e237]:
              - heading "Antes de comenzar" [level=2] [ref=f3e238]
              - link "Sección titulada «Antes de comenzar»" [ref=f3e239] [cursor=pointer]:
                - /url: "#antes-de-comenzar"
            - list [ref=f3e244]:
              - listitem [ref=f3e245]: Ten disponible una foto clara o permiso para usar la cámara.
              - listitem [ref=f3e246]: Confirma fecha de nacimiento, estado de bautismo y datos de un contacto de emergencia.
              - listitem [ref=f3e247]: Si eres menor de 18 años, prepara la información del representante legal.
              - listitem [ref=f3e248]: Identifica país, unión, campo local y club antes de elegir la sección.
            - generic [ref=f3e249]:
              - 'heading "Paso 1: foto" [level=2] [ref=f3e250]'
              - 'link "Sección titulada «Paso 1: foto»" [ref=f3e251] [cursor=pointer]':
                - /url: "#paso-1-foto"
            - list [ref=f3e256]:
              - listitem [ref=f3e257]:
                - text: Elige
                - strong [ref=f3e258]: Tomar foto
                - text: o
                - strong [ref=f3e259]: Seleccionar de galería
                - text: .
              - listitem [ref=f3e260]: Ajusta el recorte cuadrado y confirma.
              - listitem [ref=f3e261]: Espera a que termine la carga.
              - listitem [ref=f3e262]:
                - text: Pulsa
                - strong [ref=f3e263]: Siguiente
                - text: cuando el botón quede habilitado.
            - paragraph [ref=f3e264]: La interfaz vigente exige una foto para completar este paso. No cierres la pantalla mientras se está cargando; si falla, vuelve a seleccionarla y espera la confirmación.
            - generic [ref=f3e265]:
              - 'heading "Paso 2: datos personales y contactos" [level=2] [ref=f3e266]'
              - 'link "Sección titulada «Paso 2: datos personales y contactos»" [ref=f3e267] [cursor=pointer]':
                - /url: "#paso-2-datos-personales-y-contactos"
            - paragraph [ref=f3e272]: "Completa primero los datos que bloquean el avance:"
            - list [ref=f3e273]:
              - listitem [ref=f3e274]: género;
              - listitem [ref=f3e275]: fecha de nacimiento;
              - listitem [ref=f3e276]:
                - text: bautismo en
                - strong [ref=f3e277]: Sí
                - text: o
                - strong [ref=f3e278]: "No"
                - text: ;
              - listitem [ref=f3e279]:
                - text: fecha de bautismo cuando elegiste
                - strong [ref=f3e280]: Sí
                - text: ;
              - listitem [ref=f3e281]: por lo menos un contacto de emergencia activo;
              - listitem [ref=f3e282]: representante legal cuando el sistema determina que eres menor de 18 años.
            - paragraph [ref=f3e283]: El tipo de sangre se puede registrar en el mismo paso, pero no bloquea el botón. La app permite hasta cinco contactos de emergencia; evita registrar a la misma persona varias veces.
            - generic [ref=f3e284]:
              - heading "Declarar salud sin ambigüedad" [level=2] [ref=f3e285]
              - link "Sección titulada «Declarar salud sin ambigüedad»" [ref=f3e286] [cursor=pointer]:
                - /url: "#declarar-salud-sin-ambigüedad"
            - paragraph [ref=f3e291]:
              - text: Revisa por separado
              - strong [ref=f3e292]: Alergias
              - text: ","
              - strong [ref=f3e293]: Enfermedades
              - text: "y"
              - strong [ref=f3e294]: Medicamentos
              - text: ":"
            - list [ref=f3e295]:
              - listitem [ref=f3e296]: Si tienes registros, abre cada catálogo y selecciona los correspondientes.
              - listitem [ref=f3e297]:
                - text: Si no tienes ninguno, marca explícitamente la opción
                - strong [ref=f3e298]: No tengo
                - text: de esa categoría.
              - listitem [ref=f3e299]: "No dejes una categoría vacía por olvido: una lista vacía no distingue por sí sola entre “sin información” y “sin padecimientos”."
              - listitem [ref=f3e300]: Antes de continuar, vuelve a la pantalla principal y confirma los contadores.
            - paragraph [ref=f3e301]: Estas declaraciones ayudan a la operación segura del club. La validación técnica del paso se concentra en los datos personales, el contacto y el representante, por lo que debes revisar salud aunque el botón ya esté habilitado.
            - generic [ref=f3e302]:
