                - strong [ref=f3e321]: Finalizar
                - text: .
            - paragraph [ref=f3e322]: Cuando solo hay una opción, la app puede seleccionarla automáticamente. La sección, el tipo de club y la clase se derivan de la fecha de nacimiento y de los catálogos; el backend vuelve a calcular la clase al guardar, por lo que no debes intentar forzar otra desde la interfaz.
            - paragraph [ref=f3e323]: "Al finalizar ocurren dos cosas distintas dentro de la misma operación:"
            - list [ref=f3e324]:
              - listitem [ref=f3e325]:
                - text: se crea o reactiva la
                - strong [ref=f3e326]: inscripción anual
                - text: de la clase correspondiente;
              - listitem [ref=f3e327]:
                - text: se crea la asignación de miembro en estado
                - code [ref=f3e328]: pending
                - text: para que la sección la revise.
            - paragraph [ref=f3e329]:
              - text: La solicitud recibe una fecha de vencimiento de
              - strong [ref=f3e330]: 8 días
              - text: . Completar el perfil no equivale todavía a tener una membresía activa.
            - generic [ref=f3e331]:
              - heading "Mientras la solicitud está pendiente" [level=2] [ref=f3e332]
              - link "Sección titulada «Mientras la solicitud está pendiente»" [ref=f3e333] [cursor=pointer]:
                - /url: "#mientras-la-solicitud-está-pendiente"
            - paragraph [ref=f3e338]:
              - text: La app abre el tablero y muestra el estado de espera. Mientras la asignación siga
              - code [ref=f3e339]: pending
              - text: ":"
            - list [ref=f3e340]:
              - listitem [ref=f3e341]: puedes consultar tu perfil;
              - listitem [ref=f3e342]: el tablero puede ofrecer la carga de certificados;
              - listitem [ref=f3e343]: los accesos operativos del club permanecen ocultos;
              - listitem [ref=f3e344]: la fecha visible indica cuándo vence la solicitud;
              - listitem [ref=f3e345]: no debes crear otra cuenta ni repetir el post-registro.
            - paragraph [ref=f3e346]:
              - text: Cuando la sección aprueba, el estado cambia a
              - code [ref=f3e347]: active
              - text: y las funciones se habilitan según el cargo y los permisos de esa asignación.
            - generic [ref=f3e348]:
