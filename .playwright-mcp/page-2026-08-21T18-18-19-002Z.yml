            - list [ref=f14e122]:
              - listitem [ref=f14e123]: La persona crea la cuenta y completa los tres pasos en la app.
              - listitem [ref=f14e124]:
                - text: SACDIA deriva la clase y crea o reactiva la
                - strong [ref=f14e125]: inscripción anual
                - text: .
              - listitem [ref=f14e126]:
                - text: En la misma operación crea la asignación de miembro como
                - code [ref=f14e127]: pending
                - text: ", con vencimiento inicial de 8 días."
              - listitem [ref=f14e128]: SACDIA notifica a los cargos revisores configurados de la sección.
              - listitem [ref=f14e129]:
                - text: El revisor abre
                - strong [ref=f14e130]: Solicitudes → Membresía
                - text: y confirma el selector
                - strong [ref=f14e131]: Club · Tipo de sección
                - text: .
              - listitem [ref=f14e132]: Revisa persona, correo, cargo, fecha de solicitud y vencimiento.
              - listitem [ref=f14e133]:
                - text: Con
                - code [ref=f14e134]: club_members:approve
                - text: ", aprueba o rechaza una sola vez."
              - listitem [ref=f14e135]: La solicitud desaparece de la cola y el contexto de autorización de la persona se invalida.
              - listitem [ref=f14e136]: La persona refresca o vuelve a entrar en la app para recibir el estado nuevo.
