        - generic [ref=f14e36]:
          - generic [ref=f14e37]:
            - paragraph [ref=f14e38]: Este proceso comienza en la app, continúa en la sección que revisa la solicitud y termina cuando la membresía queda activa.
            - generic [ref=f14e39]:
              - heading "Resultado esperado" [level=2] [ref=f14e40]
              - link "Sección titulada «Resultado esperado»" [ref=f14e41] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f14e46]: La persona conserva una sola cuenta, completa su perfil, recibe la inscripción anual correspondiente y entra a la sección correcta con una membresía aprobada.
            - generic [ref=f14e47]:
              - heading "No confundas cuenta y membresía" [level=2] [ref=f14e48]
