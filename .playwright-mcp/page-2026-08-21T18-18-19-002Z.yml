                - /url: "#no-confundas-cuenta-y-membresía"
            - paragraph [ref=f14e54]: "SACDIA maneja registros distintos:"
            - list [ref=f14e55]:
              - listitem [ref=f14e56]:
                - strong [ref=f14e57]: "Cuenta:"
                - text: identidad con correo y contraseña que permite autenticarse.
              - listitem [ref=f14e58]:
                - strong [ref=f14e59]: "Post-registro:"
                - text: foto, datos personales y selección territorial.
              - listitem [ref=f14e60]:
                - strong [ref=f14e61]: "Inscripción anual:"
                - text: vínculo de la persona con una clase progresiva durante el año eclesiástico.
              - listitem [ref=f14e62]:
                - strong [ref=f14e63]: "Membresía:"
                - text: asignación de miembro dentro de una sección, inicialmente
                - code [ref=f14e64]: pending
                - text: .
            - paragraph [ref=f14e65]: Una persona puede iniciar sesión y tener inscripción anual mientras su membresía sigue pendiente. En ese estado ve el tablero restringido, pero no las funciones operativas del club.
