            - list [ref=f11e122]:
              - listitem [ref=f11e123]: La persona crea una cuenta con nombre, apellidos, correo y contraseña.
              - listitem [ref=f11e124]: La app inicia la sesión y abre el post-registro.
              - listitem [ref=f11e125]: La persona carga la foto requerida.
              - listitem [ref=f11e126]: Captura género, nacimiento, bautismo, al menos un contacto y representante legal si es menor.
              - listitem [ref=f11e127]: Declara alergias, enfermedades y medicamentos, incluso cuando no tiene ninguno.
              - listitem [ref=f11e128]: Selecciona país, unión, campo local, club y sección.
              - listitem [ref=f11e129]:
                - text: SACDIA deriva la clase para el año eclesiástico y crea o reactiva la
                - strong [ref=f11e130]: inscripción anual
                - text: .
              - listitem [ref=f11e131]:
                - text: En la misma operación crea la membresía como
                - code [ref=f11e132]: pending
                - text: ", con vencimiento inicial de 8 días."
              - listitem [ref=f11e133]: SACDIA notifica a los cargos revisores configurados de la sección.
              - listitem [ref=f11e134]:
                - text: Una persona con
                - code [ref=f11e135]: club_members:approve
                - text: confirma la sección y aprueba o rechaza.
              - listitem [ref=f11e136]: La persona actualiza o vuelve a entrar en la app para recibir el estado nuevo.
            - paragraph [ref=f11e137]: La notificación puede llegar a dirección, subdirección, secretaría o secretaría-tesorería, pero el permiso efectivo y el alcance de sección son la autorización final.
