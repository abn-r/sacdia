                - code [ref=f11e64]: pending
                - text: .
            - paragraph [ref=f11e65]: Una persona puede iniciar sesión y tener inscripción anual mientras su membresía sigue pendiente. En ese estado ve el tablero restringido, pero no las funciones operativas del club.
