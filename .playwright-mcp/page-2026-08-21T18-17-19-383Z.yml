              - heading "Crear una cuenta" [level=2] [ref=f1e283]
              - link "Sección titulada «Crear una cuenta»" [ref=f1e284] [cursor=pointer]:
                - /url: "#crear-una-cuenta"
            - list [ref=f1e289]:
              - listitem [ref=f1e290]:
                - text: Desde
                - strong [ref=f1e291]: Iniciar sesión
                - text: ", pulsa"
                - strong [ref=f1e292]: Regístrate
                - text: .
              - listitem [ref=f1e293]: Captura nombre, apellido paterno y apellido materno.
              - listitem [ref=f1e294]: Escribe un correo al que tengas acceso. Será tu identificador para entrar y recuperar la contraseña.
              - listitem [ref=f1e295]: Crea una contraseña de al menos ocho caracteres con mayúscula, minúscula, número y carácter especial.
              - listitem [ref=f1e296]: Repite exactamente la contraseña.
              - listitem [ref=f1e297]:
                - text: Pulsa
                - strong [ref=f1e298]: Crear cuenta
                - text: una sola vez y espera la confirmación.
            - paragraph [ref=f1e299]: El botón se habilita cuando todos los campos están completos, el correo tiene formato válido y ambas contraseñas coinciden. Después del registro, la sesión queda iniciada y la app dirige al perfil inicial de tres pasos.
            - generic [ref=f1e300]:
              - heading "Iniciar sesión" [level=2] [ref=f1e301]
              - link "Sección titulada «Iniciar sesión»" [ref=f1e302] [cursor=pointer]:
                - /url: "#iniciar-sesión"
            - list [ref=f1e307]:
              - listitem [ref=f1e308]: Escribe tu correo completo y revisa que no tenga espacios.
              - listitem [ref=f1e309]: Captura la contraseña respetando mayúsculas y minúsculas.
              - listitem [ref=f1e310]:
                - text: Pulsa
                - strong [ref=f1e311]: Iniciar sesión
                - text: y espera el resultado antes de volver a intentarlo.
            - paragraph [ref=f1e312]:
              - text: Después de tres intentos fallidos consecutivos, la pantalla bloquea temporalmente el botón durante
              - strong [ref=f1e313]: 30 segundos
              - text: ". No uses ese tiempo para crear otra cuenta: revisa el correo o inicia la recuperación."
            - generic [ref=f1e314]:
              - heading "Recuperar la contraseña" [level=2] [ref=f1e315]
              - link "Sección titulada «Recuperar la contraseña»" [ref=f1e316] [cursor=pointer]:
                - /url: "#recuperar-la-contraseña"
            - list [ref=f1e321]:
              - listitem [ref=f1e322]:
                - text: Pulsa
                - strong [ref=f1e323]: ¿Olvidaste tu contraseña?
                - text: .
              - listitem [ref=f1e324]: Escribe el correo registrado.
              - listitem [ref=f1e325]:
                - text: Pulsa
                - strong [ref=f1e326]: Enviar instrucciones
                - text: .
              - listitem [ref=f1e327]: Cuando aparezca la confirmación, revisa la bandeja de entrada y correo no deseado.
              - listitem [ref=f1e328]: Abre el enlace recibido y define la nueva contraseña.
              - listitem [ref=f1e329]: Regresa a la app e inicia sesión con la contraseña nueva.
            - paragraph [ref=f1e330]: Si no recibes el mensaje, confirma primero que escribiste el mismo correo de la cuenta. Repetir la solicitud no corrige un correo distinto.
