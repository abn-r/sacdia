            - paragraph [ref=f34e190]:
              - text: SACDIA ya cuenta con servicios y componentes para cancelar o volver a solicitar. Sin embargo, una cuenta nueva sin membresía activa puede abrir un tablero restringido que solo ofrece ir al perfil. En ese recorrido los botones
              - strong [ref=f34e191]: Cancelar solicitud
              - text: ","
              - strong [ref=f34e192]: Volver a solicitar
              - text: ", la carga de certificados y la fecha de vencimiento pueden no aparecer."
            - paragraph [ref=f34e193]: "Si la acción necesaria no está visible:"
            - list [ref=f34e194]:
              - listitem [ref=f34e195]: No crees otra cuenta ni repitas el post-registro.
              - listitem [ref=f34e196]: Conserva el correo con el que te registraste.
              - listitem [ref=f34e197]: Informa el club y la sección que seleccionaste a una persona autorizada del club o a soporte.
              - listitem [ref=f34e198]: Espera la corrección del estado antes de volver a intentar.
            - generic [ref=f34e199]:
