            - paragraph [ref=f34e139]: Cuando solo hay una opción, la app puede seleccionarla automáticamente. La sección, el tipo de club y la clase se derivan de la fecha de nacimiento y de los catálogos; el backend vuelve a calcular la clase al guardar, por lo que no debes intentar forzar otra desde la interfaz.
            - paragraph [ref=f34e140]: "Al finalizar ocurren dos cosas distintas dentro de la misma operación:"
            - list [ref=f34e141]:
