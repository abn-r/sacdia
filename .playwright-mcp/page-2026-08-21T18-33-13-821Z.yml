              - listitem [ref=f34e99]: representante legal cuando el sistema determina que eres menor de 18 años.
            - paragraph [ref=f34e100]: El tipo de sangre se puede registrar en el mismo paso, pero no bloquea el botón. La app permite hasta cinco contactos de emergencia; evita registrar a la misma persona varias veces.
            - generic [ref=f34e101]:
