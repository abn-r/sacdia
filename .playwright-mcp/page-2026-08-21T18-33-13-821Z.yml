            - list [ref=f34e61]:
              - listitem [ref=f34e62]: Ten disponible una foto clara o permiso para usar la cámara.
              - listitem [ref=f34e63]: Confirma fecha de nacimiento, estado de bautismo y datos de un contacto de emergencia.
              - listitem [ref=f34e64]: Si eres menor de 18 años, prepara la información del representante legal.
              - listitem [ref=f34e65]: Identifica país, unión, campo local y club antes de elegir la sección.
