        - generic [ref=f34e35]:
          - generic [ref=f34e36]:
            - paragraph [ref=f34e37]: El post-registro aparece después de crear una cuenta o al iniciar sesión con un perfil incompleto. La app retoma automáticamente el primer paso pendiente.
            - generic [ref=f34e38]:
              - heading "Resultado esperado" [level=2] [ref=f34e39]
