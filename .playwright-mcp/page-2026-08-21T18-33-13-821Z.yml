            - list [ref=f34e112]:
              - listitem [ref=f34e113]: Si tienes registros, abre cada catálogo y selecciona los correspondientes.
              - listitem [ref=f34e114]:
                - text: Si no tienes ninguno, marca explícitamente la opción
                - strong [ref=f34e115]: No tengo
                - text: de esa categoría.
              - listitem [ref=f34e116]: "No dejes una categoría vacía por olvido: una lista vacía no distingue por sí sola entre “sin información” y “sin padecimientos”."
              - listitem [ref=f34e117]: Antes de continuar, vuelve a la pantalla principal y confirma los contadores.
            - paragraph [ref=f34e118]: Estas declaraciones ayudan a la operación segura del club. La validación técnica del paso se concentra en los datos personales, el contacto y el representante, por lo que debes revisar salud aunque el botón ya esté habilitado.
