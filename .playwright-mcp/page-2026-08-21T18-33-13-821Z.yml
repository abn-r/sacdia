                - /url: "#resultado-esperado"
            - paragraph [ref=f34e45]: Tendrás una foto, datos personales suficientes, al menos un contacto de emergencia y una solicitud de membresía vinculada al club y sección correctos.
            - generic [ref=f34e46]:
              - heading "Quién puede utilizarlo" [level=2] [ref=f34e47]
              - link "Sección titulada «Quién puede utilizarlo»" [ref=f34e48] [cursor=pointer]:
                - /url: "#quién-puede-utilizarlo"
            - paragraph [ref=f34e53]: Usuarios autenticados cuyo post-registro todavía no está completo. Cada persona completa su propia información; un cargo administrativo no debe reemplazar este recorrido salvo una corrección autorizada.
            - generic [ref=f34e54]:
