                - strong [ref=f34e80]: Siguiente
                - text: cuando el botón quede habilitado.
            - paragraph [ref=f34e81]: La interfaz vigente exige una foto para completar este paso. No cierres la pantalla mientras se está cargando; si falla, vuelve a seleccionarla y espera la confirmación.
            - generic [ref=f34e82]:
