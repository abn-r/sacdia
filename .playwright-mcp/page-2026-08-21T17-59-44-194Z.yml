            - paragraph [ref=f2e331]:
              - text: No publiques enlaces de reunión en campos distintos al destinado para ello. Antes de la fecha, abre el detalle y confirma que
              - strong [ref=f2e332]: Unirse a la reunión
              - text: dirige al destino correcto.
            - generic [ref=f2e333]:
              - heading "Crear una actividad conjunta" [level=2] [ref=f2e334]
              - link "Sección titulada «Crear una actividad conjunta»" [ref=f2e335] [cursor=pointer]:
                - /url: "#crear-una-actividad-conjunta"
            - paragraph [ref=f2e340]: La opción aparece para dirección y permite que una misma actividad abarque varias secciones del club.
            - list [ref=f2e341]:
              - listitem [ref=f2e342]:
                - text: Activa
                - strong [ref=f2e343]: Actividad conjunta
                - text: .
              - listitem [ref=f2e344]: Mantén seleccionada tu sección y agrega las demás participantes.
              - listitem [ref=f2e345]: Selecciona por lo menos dos secciones; con una sola, el formulario no guarda como conjunta.
              - listitem [ref=f2e346]: Completa el resto de la actividad y guarda.
              - listitem [ref=f2e347]: Abre el detalle y comprueba el indicador de actividad conjunta y las secciones participantes.
            - paragraph [ref=f2e348]: Una actividad conjunta no unifica la asistencia. Cada sección registra la participación de sus integrantes en su propio contexto.
            - generic [ref=f2e349]:
              - heading "Registrar asistencia" [level=2] [ref=f2e350]
              - link "Sección titulada «Registrar asistencia»" [ref=f2e351] [cursor=pointer]:
                - /url: "#registrar-asistencia"
            - paragraph [ref=f2e356]: "En el detalle verás una de dos acciones:"
            - list [ref=f2e357]:
              - listitem [ref=f2e358]:
                - strong [ref=f2e359]: Escanear QR
                - text: ": corresponde al responsable con"
                - code [ref=f2e360]: attendance:manage
                - text: o cargo operativo habilitado. Abre el escáner dentro del contexto de esa actividad.
              - listitem [ref=f2e361]:
                - strong [ref=f2e362]: Mostrar mi QR
                - text: ": abre tu tarjeta virtual para que otra persona autorizada la escanee. No confirma asistencia por sí sola."
            - paragraph [ref=f2e363]: "Para registrar:"
            - list [ref=f2e364]:
              - listitem [ref=f2e365]: Abre la actividad correcta y comprueba nombre, fecha y sección.
              - listitem [ref=f2e366]:
                - text: Pulsa
                - strong [ref=f2e367]: Escanear QR
