        - generic [ref=f2e220]:
          - generic [ref=f2e221]:
            - paragraph [ref=f2e222]:
              - text: Usa
              - strong [ref=f2e223]: Actividades
              - text: para consultar la agenda de tu sección, abrir el detalle de una actividad y, cuando tu cargo lo permite, crearla o administrar su asistencia.
            - generic [ref=f2e224]:
              - heading "Resultado esperado" [level=2] [ref=f2e225]
              - link "Sección titulada «Resultado esperado»" [ref=f2e226] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f2e231]: La actividad queda asociada al club y sección correctos, con fecha, hora, modalidad y lugar verificables. Durante la actividad, el responsable registra asistencia sin duplicados y cada miembro puede mostrar su código personal.
            - generic [ref=f2e232]:
              - heading "Quién puede utilizarlo" [level=2] [ref=f2e233]
              - link "Sección titulada «Quién puede utilizarlo»" [ref=f2e234] [cursor=pointer]:
                - /url: "#quién-puede-utilizarlo"
            - list [ref=f2e239]:
              - listitem [ref=f2e240]: Cualquier integrante puede consultar las actividades visibles de su sección.
              - listitem [ref=f2e241]:
                - text: La acción para crear se muestra con el permiso
                - code [ref=f2e242]: activities:create
                - text: .
              - listitem [ref=f2e243]:
                - text: El escáner de asistencia se muestra con
                - code [ref=f2e244]: attendance:manage
                - text: o con un cargo operativo admitido por la aplicación.
              - listitem [ref=f2e245]:
                - strong [ref=f2e246]: Mostrar mi QR
                - text: está disponible para quien necesita presentar su identificación, no para registrar su propia asistencia.
            - paragraph [ref=f2e247]: "La aplicación y el backend evalúan el cargo y el contexto activo. Si editar o eliminar aparece en el detalle pero tu cargo no corresponde, no intentes completar la acción: la autorización final la aplica el servidor."
            - generic [ref=f2e248]:
              - heading "Pantallas incluidas" [level=2] [ref=f2e249]
              - link "Sección titulada «Pantallas incluidas»" [ref=f2e250] [cursor=pointer]:
                - /url: "#pantallas-incluidas"
            - list [ref=f2e255]:
              - listitem [ref=f2e256]: Lista por fecha y vista cronológica
              - listitem [ref=f2e257]: Detalle de actividad y participantes
              - listitem [ref=f2e258]: Crear y editar actividad
              - listitem [ref=f2e259]: Selector de ubicación
              - listitem [ref=f2e260]:
                - text: Acciones
                - strong [ref=f2e261]: Escanear QR
                - text: "y"
                - strong [ref=f2e262]: Mostrar mi QR
            - generic [ref=f2e263]:
              - heading "Antes de comenzar" [level=2] [ref=f2e264]
              - link "Sección titulada «Antes de comenzar»" [ref=f2e265] [cursor=pointer]:
                - /url: "#antes-de-comenzar"
            - list [ref=f2e270]:
              - listitem [ref=f2e271]: Confirma el club y la sección activos.
              - listitem [ref=f2e272]: Ten la fecha, horario, tipo de actividad y lugar definitivos.
              - listitem [ref=f2e273]: Para una actividad conjunta, confirma qué secciones participarán.
              - listitem [ref=f2e274]: Para una actividad virtual, prepara también una imagen y, si existe, el enlace de reunión.
            - generic [ref=f2e275]:
              - heading "Consultar la agenda" [level=2] [ref=f2e276]
              - link "Sección titulada «Consultar la agenda»" [ref=f2e277] [cursor=pointer]:
                - /url: "#consultar-la-agenda"
            - list [ref=f2e282]:
              - listitem [ref=f2e283]:
                - text: Abre
                - strong [ref=f2e284]: Actividades
                - text: desde la aplicación.
              - listitem [ref=f2e285]: Usa la tira de fechas para concentrarte en un día o cambia a la vista cronológica para revisar la secuencia completa.
              - listitem [ref=f2e286]: Abre una tarjeta y verifica nombre, tipo, sección, fecha y hora.
              - listitem [ref=f2e287]: En el detalle, revisa lugar, enlace virtual, descripción y participantes antes de desplazarte o compartir instrucciones.
            - paragraph [ref=f2e288]: Si una actividad no aparece, actualiza la vista y comprueba primero la sección activa. No crees otra actividad solo porque el listado aún no se refrescó.
            - generic [ref=f2e289]:
              - heading "Crear una actividad" [level=2] [ref=f2e290]
              - link "Sección titulada «Crear una actividad»" [ref=f2e291] [cursor=pointer]:
                - /url: "#crear-una-actividad"
            - list [ref=f2e296]:
              - listitem [ref=f2e297]:
                - text: Pulsa
                - strong [ref=f2e298]: Agregar
                - text: . Si la acción no aparece, tu cuenta no tiene
                - code [ref=f2e299]: activities:create
                - text: .
              - listitem [ref=f2e300]: Captura nombre, descripción y tipo de actividad.
              - listitem [ref=f2e301]: Selecciona el lugar en el mapa. El formulario actual solicita una ubicación también para actividades virtuales.
              - listitem [ref=f2e302]: Define fecha inicial, fecha final cuando corresponda y hora.
              - listitem [ref=f2e303]: Elige la modalidad y completa sus datos adicionales.
              - listitem [ref=f2e304]: Revisa la sección y guarda una sola vez.
              - listitem [ref=f2e305]: Abre el detalle creado y confirma que la información coincide con lo planeado.
            - generic [ref=f2e306]:
              - heading "Elegir modalidad" [level=2] [ref=f2e307]
