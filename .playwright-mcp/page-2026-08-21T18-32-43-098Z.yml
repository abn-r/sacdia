            - list [ref=f27e266]:
              - listitem [ref=f27e267]: Inicia sesión y confirma el club o sección activos.
              - listitem [ref=f27e268]: Mantén conexión estable para acciones que guardan o envían información.
              - listitem [ref=f27e269]: Si una acción no aparece, revisa primero el cargo y el contexto.
            - generic [ref=f27e270]:
              - heading "Tareas principales" [level=2] [ref=f27e271]
              - link "Sección titulada «Tareas principales»" [ref=f27e272] [cursor=pointer]:
                - /url: "#tareas-principales"
            - list [ref=f27e277]:
              - listitem [ref=f27e278]: Buscar miembros y filtrar por clase.
              - listitem [ref=f27e279]: Abrir perfil, clases, especialidades y datos permitidos.
              - listitem [ref=f27e280]: Revisar solicitudes de ingreso.
              - listitem [ref=f27e281]: Asignar, cambiar o revocar un cargo dentro de la sección.
            - generic [ref=f27e282]:
              - heading "Revisar solicitudes en la app" [level=2] [ref=f27e283]
              - link "Sección titulada «Revisar solicitudes en la app»" [ref=f27e284] [cursor=pointer]:
                - /url: "#revisar-solicitudes-en-la-app"
            - list [ref=f27e289]:
              - listitem [ref=f27e290]:
                - text: Abre
                - strong [ref=f27e291]: Miembros
                - text: y confirma el club y la sección activos.
              - listitem [ref=f27e292]:
                - text: Selecciona la pestaña
                - strong [ref=f27e293]: Solicitudes
                - text: .
              - listitem [ref=f27e294]: Busca a la persona y abre su perfil antes de decidir.
              - listitem [ref=f27e295]:
                - text: Si aparecen las acciones y cuentas con
                - code [ref=f27e296]: club_members:approve
                - text: en esa sección, pulsa
                - strong [ref=f27e297]: Aprobar
                - text: o
                - strong [ref=f27e298]: Rechazar
                - text: una sola vez.
              - listitem [ref=f27e299]: Actualiza la lista y confirma que la solicitud dejó de estar pendiente.
            - paragraph [ref=f27e300]: En la versión actual, ambas acciones se envían sin confirmación adicional y el rechazo móvil no solicita un motivo. Revisa con cuidado antes de pulsar.
            - paragraph [ref=f27e301]:
              - text: "Existe una diferencia conocida entre permisos: dirección recibe el permiso visual y"
              - code [ref=f27e302]: club_members:approve
              - text: ", pero subdirección, secretaría y secretaría-tesorería pueden tener autorización backend para revisar sin recibir"
              - code [ref=f27e303]: club_roles:assign
              - text: o
              - code [ref=f27e304]: club_roles:revoke
              - text: ". En ese caso los botones quedan ocultos aunque el backend permita la decisión. No intentes entrar al panel administrativo: reporta la inconsistencia de acceso para que se corrija el canal móvil."
            - generic [ref=f27e305]:
