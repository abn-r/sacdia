            - generic [ref=f27e219]:
              - heading "Resultado esperado" [level=2] [ref=f27e220]
              - link "Sección titulada «Resultado esperado»" [ref=f27e221] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f27e226]: Al terminar este recorrido, podrás consultar miembros de la sección, revisar solicitudes y administrar cargos autorizados.
            - generic [ref=f27e227]:
              - heading "Quién puede utilizarlo" [level=2] [ref=f27e228]
              - link "Sección titulada «Quién puede utilizarlo»" [ref=f27e229] [cursor=pointer]:
                - /url: "#quién-puede-utilizarlo"
            - paragraph [ref=f27e234]:
              - text: Miembros con lectura de su sección. La app utiliza
              - code [ref=f27e235]: club_roles:assign
              - text: o
              - code [ref=f27e236]: club_roles:revoke
              - text: como control visual para mostrar acciones administrativas, mientras el backend exige
              - code [ref=f27e237]: club_members:approve
              - text: y el alcance de la sección para listar y decidir solicitudes de ingreso.
            - generic [ref=f27e238]:
              - heading "Pantallas incluidas" [level=2] [ref=f27e239]
