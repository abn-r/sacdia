        - generic [ref=f2e35]:
          - generic [ref=f2e36]:
            - paragraph [ref=f2e37]: Esta bandeja corresponde únicamente a las solicitudes de ingreso como miembro. Las solicitudes de cargos y los traslados siguen recorridos separados.
            - generic [ref=f2e38]:
              - heading "Resultado esperado" [level=2] [ref=f2e39]
              - link "Sección titulada «Resultado esperado»" [ref=f2e40] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f2e45]: Podrás revisar la sección correcta, decidir una solicitud pendiente y confirmar que desapareció de la cola sin duplicar asignaciones.
            - generic [ref=f2e46]:
              - heading "Acceso requerido" [level=2] [ref=f2e47]
              - link "Sección titulada «Acceso requerido»" [ref=f2e48] [cursor=pointer]:
