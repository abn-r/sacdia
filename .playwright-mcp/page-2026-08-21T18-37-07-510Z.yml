              - link "Sección titulada «Reconoce la pantalla»" [ref=f2e70] [cursor=pointer]:
                - /url: "#reconoce-la-pantalla"
            - figure "Confirma la sección antes de decidir; la bandeja contiene solo solicitudes en estado pending y con la asignación activa dentro del contexto elegido." [ref=f2e75]:
              - img "Panel de Solicitudes de Membresía con selector de sección, contador de pendientes y botón Actualizar" [ref=f2e76]
            - generic [ref=f2e78]:
