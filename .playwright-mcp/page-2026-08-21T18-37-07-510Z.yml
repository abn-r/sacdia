                  - cell "La persona canceló su propia solicitud." [ref=f2e177]
                  - cell "Selecciona otra sección cuando la app reabra el paso." [ref=f2e178]
                - row [ref=f2e179]:
                  - cell [ref=f2e180]:
                    - code [ref=f2e181]: expired
                  - cell "El plazo terminó sin decisión." [ref=f2e182]
                  - cell "La persona vuelve a solicitar si la app muestra la acción; de lo contrario, pide asistencia." [ref=f2e183]
            - paragraph [ref=f2e184]:
              - text: Al crear la solicitud, SACDIA fija
              - code [ref=f2e185]: expires_at
              - text: en
              - strong [ref=f2e186]: 8 días
              - text: y la tabla utiliza esa fecha para mostrar el vencimiento y la prioridad de 48 horas. Por separado, el proceso automático se ejecuta cada hora y vence solicitudes al comparar
              - code [ref=f2e187]: created_at
              - text: con
              - code [ref=f2e188]: membership.pending_timeout_days
              - text: ", cuyo valor predeterminado también es 8."
            - generic [ref=f2e189]:
              - heading "Limitación del plazo" [level=2] [ref=f2e190]
              - link "Sección titulada «Limitación del plazo»" [ref=f2e191] [cursor=pointer]:
                - /url: "#limitación-del-plazo"
            - paragraph [ref=f2e196]:
              - text: Si
              - code [ref=f2e197]: membership.pending_timeout_days
              - text: "se configura con un valor distinto de 8, la fecha visible y el vencimiento automático pueden divergir: el proceso no consulta"
              - code [ref=f2e198]: expires_at
              - text: . No prometas la fecha mostrada como garantía exacta del cierre hasta que ambos cálculos usen la misma fuente.
            - generic [ref=f2e199]:
              - heading "Limitación de auditoría" [level=2] [ref=f2e200]
              - link "Sección titulada «Limitación de auditoría»" [ref=f2e201] [cursor=pointer]:
                - /url: "#limitación-de-auditoría"
            - paragraph [ref=f2e206]:
              - text: La asignación guarda el estado, el motivo de rechazo y actualiza
              - code [ref=f2e207]: modified_at
              - text: "al decidir. Esa marca conserva la hora de la última modificación, pero no demuestra por sí sola qué operación ocurrió ni quién la realizó: el modelo no persiste al actor ni campos semánticos"
              - code [ref=f2e208]: approved_at
              - text: o
              - code [ref=f2e209]: rejected_at
              - text: . No uses esta bandeja como única evidencia de autoría; si el procedimiento institucional exige trazabilidad nominal, registra el respaldo en el canal autorizado hasta que existan esos campos en SACDIA.
            - generic [ref=f2e210]:
              - heading "Cómo verificarlo" [level=2] [ref=f2e211]
              - link "Sección titulada «Cómo verificarlo»" [ref=f2e212] [cursor=pointer]:
                - /url: "#cómo-verificarlo"
            - paragraph [ref=f2e217]:
              - text: Pulsa
              - strong [ref=f2e218]: Actualizar
              - text: y confirma que la solicitud ya no aparece en la sección. Después de aprobar, la persona debe refrescar o volver a entrar y comprobar que la membresía quedó
              - code [ref=f2e219]: active
              - text: . En cambio, un rechazo o vencimiento puede no mostrar un aviso ni las acciones de corrección en una cuenta nueva; si ocurre, conserva la cuenta y utiliza el canal de soporte documentado.
            - generic [ref=f2e220]:
