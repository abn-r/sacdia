              - link "Sección titulada «Seleccionar la sección»" [ref=f2e80] [cursor=pointer]:
                - /url: "#seleccionar-la-sección"
            - list [ref=f2e85]:
              - listitem [ref=f2e86]:
                - text: Abre
                - strong [ref=f2e87]: Solicitudes → Membresía
                - text: .
              - listitem [ref=f2e88]:
                - text: Revisa el selector
                - strong [ref=f2e89]: Sección del club
                - text: antes de utilizar la tabla.
              - listitem [ref=f2e90]: El panel selecciona inicialmente la primera sección disponible; no supongas que es la que vas a operar.
              - listitem [ref=f2e91]:
                - text: Elige la opción identificada por
                - strong [ref=f2e92]: Club · Tipo de sección
                - text: .
              - listitem [ref=f2e93]: Espera a que el contador y la tabla terminen de actualizarse.
            - paragraph [ref=f2e94]: Si aparece un error de permisos, confirma tu cargo y el contexto. No intentes resolverlo cambiando manualmente el identificador de la URL.
            - generic [ref=f2e95]:
              - heading "Revisar antes de decidir" [level=2] [ref=f2e96]
              - link "Sección titulada «Revisar antes de decidir»" [ref=f2e97] [cursor=pointer]:
                - /url: "#revisar-antes-de-decidir"
            - paragraph [ref=f2e102]:
              - text: La cola muestra únicamente asignaciones en estado
              - code [ref=f2e103]: pending
              - text: y con la bandera
              - code [ref=f2e104]: "active: true"
              - text: ", ordenadas desde la solicitud más antigua. Aquí"
              - code [ref=f2e105]: active
              - text: "describe la vigencia del registro, no el estado aprobado de la membresía. Antes de actuar, verifica:"
            - list [ref=f2e106]:
              - listitem [ref=f2e107]: nombre y correo de la persona;
              - listitem [ref=f2e108]: cargo solicitado, normalmente miembro;
              - listitem [ref=f2e109]: fecha en que se creó la solicitud;
              - listitem [ref=f2e110]: fecha y hora de vencimiento;
              - listitem [ref=f2e111]: club y sección seleccionados en el filtro.
            - paragraph [ref=f2e112]:
              - text: Un icono de reloj resalta las solicitudes que vencen en menos de
              - strong [ref=f2e113]: 48 horas
              - text: . Priorízalas, pero no apruebes sin confirmar la identidad y la sección.
            - generic [ref=f2e114]:
              - heading "Aprobar" [level=2] [ref=f2e115]
              - link "Sección titulada «Aprobar»" [ref=f2e116] [cursor=pointer]:
                - /url: "#aprobar"
            - list [ref=f2e121]:
              - listitem [ref=f2e122]: Revisa toda la fila.
              - listitem [ref=f2e123]: Pulsa el icono de aprobación una sola vez.
              - listitem [ref=f2e124]: Espera el mensaje de confirmación y la actualización automática de la tabla.
              - listitem [ref=f2e125]: Confirma que la persona ya no aparece en pendientes.
            - paragraph [ref=f2e126]:
              - text: "La aprobación no abre un diálogo de confirmación: el clic envía la decisión inmediatamente. El estado cambia a"
              - code [ref=f2e127]: active
              - text: ", se elimina la fecha de vencimiento y se invalida el contexto de autorización para que la app reciba los permisos del cargo."
            - generic [ref=f2e128]:
              - heading "Rechazar" [level=2] [ref=f2e129]
              - link "Sección titulada «Rechazar»" [ref=f2e130] [cursor=pointer]:
                - /url: "#rechazar"
            - list [ref=f2e135]:
              - listitem [ref=f2e136]: Pulsa el icono de rechazo.
              - listitem [ref=f2e137]: Revisa nuevamente el nombre mostrado en el diálogo.
              - listitem [ref=f2e138]:
                - text: Escribe una razón clara cuando ayude a la persona a corregir la solicitud. El
                - strong [ref=f2e139]: motivo es opcional
                - text: y admite hasta 500 caracteres.
              - listitem [ref=f2e140]:
                - text: Pulsa
                - strong [ref=f2e141]: Rechazar
                - text: y espera la confirmación.
              - listitem [ref=f2e142]: Comprueba que la fila desapareció de la cola.
            - paragraph [ref=f2e143]:
              - text: El estado cambia a
              - code [ref=f2e144]: rejected
              - text: y la app puede mostrar la razón capturada. No incluyas datos médicos, contraseñas ni información que no sea necesaria para corregir el ingreso.
            - generic [ref=f2e145]:
              - heading "Estados y vencimiento" [level=2] [ref=f2e146]
