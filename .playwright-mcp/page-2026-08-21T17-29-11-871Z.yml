                - /url: "#entender-el-progreso"
            - paragraph [ref=f6e109]: "Cada inscripción queda asociada a una versión específica de la certificación. Los módulos contienen requisitos y cada requisito puede combinar distintos componentes:"
            - list [ref=f6e110]:
              - listitem [ref=f6e111]: respuesta de texto;
              - listitem [ref=f6e112]: declaración o confirmación;
              - listitem [ref=f6e113]: especialidad relacionada;
              - listitem [ref=f6e114]: actividad relacionada;
              - listitem [ref=f6e115]: archivo de evidencia;
              - listitem [ref=f6e116]: validación automática.
            - paragraph [ref=f6e117]: Completa lo que realmente aparece en el requisito. No sustituyas un componente obligatorio con un comentario o archivo en otro espacio.
            - generic [ref=f6e118]:
              - heading "Trabajar un requisito" [level=2] [ref=f6e119]
