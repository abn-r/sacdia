            - paragraph [ref=f6e101]: La elegibilidad puede considerar edad, bautismo, clase investida, tipo de club o cargo activo. Si la versión publicada no tiene reglas configuradas, la app deshabilita la inscripción en lugar de asumir que eres elegible.
