              - listitem [ref=f6e128]: Selecciona un requisito en estado editable.
              - listitem [ref=f6e129]: Completa sus respuestas y adjunta la evidencia solicitada.
              - listitem [ref=f6e130]: Guarda el borrador y confirma que la información permanezca al volver.
              - listitem [ref=f6e131]:
                - text: Pulsa
                - strong [ref=f6e132]: Enviar requisito
                - text: cuando todos los componentes estén completos.
              - listitem [ref=f6e133]: Espera la revisión antes de modificarlo nuevamente.
