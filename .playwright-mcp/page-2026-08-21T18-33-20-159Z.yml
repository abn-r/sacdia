        - heading "Alta de cuenta y membresía" [level=1] [ref=f36e34]
        - generic [ref=f36e36]:
          - generic [ref=f36e37]:
            - paragraph [ref=f36e38]: Este proceso comienza en la app, continúa en la sección que revisa la solicitud y termina cuando la membresía queda activa.
            - generic [ref=f36e39]:
              - heading "Resultado esperado" [level=2] [ref=f36e40]
              - link "Sección titulada «Resultado esperado»" [ref=f36e41] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f36e46]: La persona conserva una sola cuenta, completa su perfil, recibe la inscripción anual correspondiente y entra a la sección correcta con una membresía aprobada.
            - generic [ref=f36e47]:
              - heading "No confundas cuenta y membresía" [level=2] [ref=f36e48]
              - link "Sección titulada «No confundas cuenta y membresía»" [ref=f36e49] [cursor=pointer]:
                - /url: "#no-confundas-cuenta-y-membresía"
            - paragraph [ref=f36e54]: "SACDIA maneja registros distintos:"
            - list [ref=f36e55]:
              - listitem [ref=f36e56]:
                - strong [ref=f36e57]: "Cuenta:"
                - text: identidad con correo y contraseña que permite autenticarse.
              - listitem [ref=f36e58]:
                - strong [ref=f36e59]: "Post-registro:"
                - text: foto, datos personales y selección territorial.
              - listitem [ref=f36e60]:
                - strong [ref=f36e61]: "Inscripción anual:"
                - text: vínculo de la persona con una clase progresiva durante el año eclesiástico.
              - listitem [ref=f36e62]:
                - strong [ref=f36e63]: "Membresía:"
                - text: asignación de miembro dentro de una sección, inicialmente
                - code [ref=f36e64]: pending
                - text: .
            - paragraph [ref=f36e65]: Una persona puede iniciar sesión y tener inscripción anual mientras su membresía sigue pendiente. En ese estado ve el tablero restringido, pero no las funciones operativas del club.
            - generic [ref=f36e66]:
              - heading "Participantes" [level=2] [ref=f36e67]
              - link "Sección titulada «Participantes»" [ref=f36e68] [cursor=pointer]:
                - /url: "#participantes"
            - list [ref=f36e73]:
              - listitem [ref=f36e74]: Persona solicitante.
              - listitem [ref=f36e75]: Dirección, subdirección o secretaría de la sección cuando cuenta con los permisos efectivos para revisar desde la app.
              - listitem [ref=f36e76]: Personal administrativo o territorial admitido en el panel y con alcance sobre la sección.
              - listitem [ref=f36e77]: SACDIA, que deriva clase, controla estados y vence pendientes.
            - generic [ref=f36e78]:
              - heading "Matriz de responsabilidades" [level=2] [ref=f36e79]
