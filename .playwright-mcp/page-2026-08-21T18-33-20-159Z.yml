              - listitem [ref=f36e213]: "Contraseña olvidada: utiliza recuperación de contraseña."
              - listitem [ref=f36e214]: "Datos personales incorrectos: actualiza el perfil o solicita la corrección autorizada."
            - paragraph [ref=f36e215]: "La autocorrección no siempre aparece: una cuenta nueva sin asignación activa puede recibir el tablero restringido que solo enlaza al perfil, aunque backend y componente ya soporten cancelar o volver a solicitar. Si falta la acción, conserva el correo y solicita apoyo a una persona autorizada del club o a soporte para corregir el estado."
            - paragraph [ref=f36e216]:
              - strong [ref=f36e217]: No crees otra cuenta
              - text: para corregir membresía, inscripción, correo olvidado o un rechazo. Duplicar la identidad separa el historial y complica la revisión.
