              - rowgroup [ref=f36e92]:
                - row [ref=f36e93]:
                  - cell "Cuenta" [ref=f36e94]
                  - cell "Captura datos reales y conserva el correo." [ref=f36e95]
                  - cell "No crea otra cuenta por la persona." [ref=f36e96]
                  - cell "Crea identidad y sesión." [ref=f36e97]
                - row [ref=f36e98]:
                  - cell "Perfil inicial" [ref=f36e99]
                  - cell "Carga foto, datos, contactos y selección correcta." [ref=f36e100]
                  - cell "Orienta sin pedir contraseñas ni datos médicos por canales externos." [ref=f36e101]
                  - cell "Valida los tres pasos." [ref=f36e102]
                - row [ref=f36e103]:
                  - cell "Inscripción anual" [ref=f36e104]
                  - cell "Revisa la clase mostrada." [ref=f36e105]
                  - cell "Corrige excepciones por el proceso autorizado." [ref=f36e106]
                  - cell "Deriva clase por edad/tipo y crea o reactiva el registro anual." [ref=f36e107]
                - row [ref=f36e108]:
                  - cell "Membresía" [ref=f36e109]
                  - cell "Espera y conserva la misma cuenta; cancela o vuelve a solicitar solo si la app muestra la acción." [ref=f36e110]
                  - cell [ref=f36e111]:
                    - text: Aprueba o rechaza con
                    - code [ref=f36e112]: club_members:approve
                    - text: en su alcance.
                  - cell [ref=f36e113]:
                    - text: Crea la asignación
                    - code [ref=f36e114]: pending
                    - text: ", notifica y actualiza permisos."
            - generic [ref=f36e115]:
              - heading "Flujo completo" [level=2] [ref=f36e116]
              - link "Sección titulada «Flujo completo»" [ref=f36e117] [cursor=pointer]:
                - /url: "#flujo-completo"
            - list [ref=f36e122]:
              - listitem [ref=f36e123]: La persona crea una cuenta con nombre, apellidos, correo y contraseña.
              - listitem [ref=f36e124]: La app inicia la sesión y abre el post-registro.
              - listitem [ref=f36e125]: La persona carga la foto requerida.
              - listitem [ref=f36e126]: Captura género, nacimiento, bautismo, al menos un contacto y representante legal si es menor.
              - listitem [ref=f36e127]: Declara alergias, enfermedades y medicamentos, incluso cuando no tiene ninguno.
              - listitem [ref=f36e128]: Selecciona país, unión, campo local, club y sección.
              - listitem [ref=f36e129]:
                - text: SACDIA deriva la clase para el año eclesiástico y crea o reactiva la
                - strong [ref=f36e130]: inscripción anual
                - text: .
              - listitem [ref=f36e131]:
                - text: En la misma operación crea la membresía como
                - code [ref=f36e132]: pending
                - text: ", con vencimiento inicial de 8 días."
              - listitem [ref=f36e133]: SACDIA notifica a los cargos revisores configurados de la sección.
              - listitem [ref=f36e134]:
                - text: Una persona con
                - code [ref=f36e135]: club_members:approve
                - text: confirma la sección y aprueba o rechaza.
              - listitem [ref=f36e136]: La persona actualiza o vuelve a entrar en la app para recibir el estado nuevo.
            - paragraph [ref=f36e137]: La notificación puede llegar a dirección, subdirección, secretaría o secretaría-tesorería, pero el permiso efectivo y el alcance de sección son la autorización final.
            - generic [ref=f36e138]:
              - heading "Canal de revisión según el cargo" [level=2] [ref=f36e139]
              - link "Sección titulada «Canal de revisión según el cargo»" [ref=f36e140] [cursor=pointer]:
                - /url: "#canal-de-revisión-según-el-cargo"
            - list [ref=f36e145]:
              - listitem [ref=f36e146]:
                - strong [ref=f36e147]: "Cargos de club:"
                - text: revisan desde
                - strong [ref=f36e148]: Miembros → Solicitudes
                - text: en la app cuando la acción está disponible. El control visual móvil usa
                - code [ref=f36e149]: club_roles:assign
                - text: o
                - code [ref=f36e150]: club_roles:revoke
                - text: ", mientras el backend exige"
                - code [ref=f36e151]: club_members:approve
                - text: en la sección. Dirección recibe ambos permisos en la configuración inicial; subdirección, secretaría y secretaría-tesorería pueden tener autorización backend, pero sus botones quedan ocultos por el control visual actual.
              - listitem [ref=f36e152]:
                - strong [ref=f36e153]: "Roles administrativos o territoriales:"
                - text: revisan desde
                - strong [ref=f36e154]: Solicitudes → Membresía
                - text: en el panel, siempre que su rol sea admitido allí y tengan
                - code [ref=f36e155]: club_members:approve
                - text: en el alcance correspondiente.
            - paragraph [ref=f36e156]: Los canales no son intercambiables. Los cargos de club no obtienen acceso al panel solo por su cargo, y una cuenta administrativa no debe decidir fuera de su alcance territorial. Si una persona autorizada no ve la acción móvil, debe reportar la inconsistencia de acceso.
