            - paragraph [ref=f16e139]: Cuando solo hay una opción, la app puede seleccionarla automáticamente. La sección, el tipo de club y la clase se derivan de la fecha de nacimiento y de los catálogos; el backend vuelve a calcular la clase al guardar, por lo que no debes intentar forzar otra desde la interfaz.
