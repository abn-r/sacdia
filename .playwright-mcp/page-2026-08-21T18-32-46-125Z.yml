      - main [ref=f28e213]:
        - heading "Alta de cuenta y membresía" [level=1] [ref=f28e216]
        - generic [ref=f28e218]:
          - generic [ref=f28e219]:
            - paragraph [ref=f28e220]: Este proceso comienza en la app, continúa en la sección que revisa la solicitud y termina cuando la membresía queda activa.
            - generic [ref=f28e221]:
              - heading "Resultado esperado" [level=2] [ref=f28e222]
              - link "Sección titulada «Resultado esperado»" [ref=f28e223] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f28e228]: La persona conserva una sola cuenta, completa su perfil, recibe la inscripción anual correspondiente y entra a la sección correcta con una membresía aprobada.
            - generic [ref=f28e229]:
              - heading "No confundas cuenta y membresía" [level=2] [ref=f28e230]
              - link "Sección titulada «No confundas cuenta y membresía»" [ref=f28e231] [cursor=pointer]:
                - /url: "#no-confundas-cuenta-y-membresía"
            - paragraph [ref=f28e236]: "SACDIA maneja registros distintos:"
            - list [ref=f28e237]:
              - listitem [ref=f28e238]:
                - strong [ref=f28e239]: "Cuenta:"
                - text: identidad con correo y contraseña que permite autenticarse.
              - listitem [ref=f28e240]:
                - strong [ref=f28e241]: "Post-registro:"
                - text: foto, datos personales y selección territorial.
              - listitem [ref=f28e242]:
                - strong [ref=f28e243]: "Inscripción anual:"
                - text: vínculo de la persona con una clase progresiva durante el año eclesiástico.
              - listitem [ref=f28e244]:
                - strong [ref=f28e245]: "Membresía:"
                - text: asignación de miembro dentro de una sección, inicialmente
                - code [ref=f28e246]: pending
                - text: .
            - paragraph [ref=f28e247]: Una persona puede iniciar sesión y tener inscripción anual mientras su membresía sigue pendiente. En ese estado ve el tablero restringido, pero no las funciones operativas del club.
            - generic [ref=f28e248]:
              - heading "Participantes" [level=2] [ref=f28e249]
              - link "Sección titulada «Participantes»" [ref=f28e250] [cursor=pointer]:
                - /url: "#participantes"
            - list [ref=f28e255]:
              - listitem [ref=f28e256]: Persona solicitante.
              - listitem [ref=f28e257]: Dirección, subdirección o secretaría de la sección cuando cuenta con los permisos efectivos para revisar desde la app.
              - listitem [ref=f28e258]: Personal administrativo o territorial admitido en el panel y con alcance sobre la sección.
              - listitem [ref=f28e259]: SACDIA, que deriva clase, controla estados y vence pendientes.
            - generic [ref=f28e260]:
              - heading "Matriz de responsabilidades" [level=2] [ref=f28e261]
              - link "Sección titulada «Matriz de responsabilidades»" [ref=f28e262] [cursor=pointer]:
                - /url: "#matriz-de-responsabilidades"
            - table [ref=f28e267]:
              - rowgroup [ref=f28e268]:
                - row [ref=f28e269]:
                  - columnheader "Etapa" [ref=f28e270]
                  - columnheader "Persona solicitante" [ref=f28e271]
                  - columnheader "Revisor de la sección" [ref=f28e272]
                  - columnheader "Sistema" [ref=f28e273]
              - rowgroup [ref=f28e274]:
                - row [ref=f28e275]:
                  - cell "Cuenta" [ref=f28e276]
                  - cell "Captura datos reales y conserva el correo." [ref=f28e277]
                  - cell "No crea otra cuenta por la persona." [ref=f28e278]
                  - cell "Crea identidad y sesión." [ref=f28e279]
                - row [ref=f28e280]:
                  - cell "Perfil inicial" [ref=f28e281]
                  - cell "Carga foto, datos, contactos y selección correcta." [ref=f28e282]
                  - cell "Orienta sin pedir contraseñas ni datos médicos por canales externos." [ref=f28e283]
                  - cell "Valida los tres pasos." [ref=f28e284]
                - row [ref=f28e285]:
                  - cell "Inscripción anual" [ref=f28e286]
                  - cell "Revisa la clase mostrada." [ref=f28e287]
                  - cell "Corrige excepciones por el proceso autorizado." [ref=f28e288]
                  - cell "Deriva clase por edad/tipo y crea o reactiva el registro anual." [ref=f28e289]
                - row [ref=f28e290]:
                  - cell "Membresía" [ref=f28e291]
                  - cell "Espera y conserva la misma cuenta; cancela o vuelve a solicitar solo si la app muestra la acción." [ref=f28e292]
                  - cell [ref=f28e293]:
                    - text: Aprueba o rechaza con
                    - code [ref=f28e294]: club_members:approve
                    - text: en su alcance.
                  - cell [ref=f28e295]:
                    - text: Crea la asignación
                    - code [ref=f28e296]: pending
                    - text: ", notifica y actualiza permisos."
            - generic [ref=f28e297]:
              - heading "Flujo completo" [level=2] [ref=f28e298]
              - link "Sección titulada «Flujo completo»" [ref=f28e299] [cursor=pointer]:
                - /url: "#flujo-completo"
            - list [ref=f28e304]:
              - listitem [ref=f28e305]: La persona crea una cuenta con nombre, apellidos, correo y contraseña.
              - listitem [ref=f28e306]: La app inicia la sesión y abre el post-registro.
              - listitem [ref=f28e307]: La persona carga la foto requerida.
              - listitem [ref=f28e308]: Captura género, nacimiento, bautismo, al menos un contacto y representante legal si es menor.
              - listitem [ref=f28e309]: Declara alergias, enfermedades y medicamentos, incluso cuando no tiene ninguno.
              - listitem [ref=f28e310]: Selecciona país, unión, campo local, club y sección.
              - listitem [ref=f28e311]:
                - text: SACDIA deriva la clase para el año eclesiástico y crea o reactiva la
                - strong [ref=f28e312]: inscripción anual
                - text: .
              - listitem [ref=f28e313]:
                - text: En la misma operación crea la membresía como
                - code [ref=f28e314]: pending
                - text: ", con vencimiento inicial de 8 días."
              - listitem [ref=f28e315]: SACDIA notifica a los cargos revisores configurados de la sección.
              - listitem [ref=f28e316]:
                - text: Una persona con
                - code [ref=f28e317]: club_members:approve
                - text: confirma la sección y aprueba o rechaza.
              - listitem [ref=f28e318]: La persona actualiza o vuelve a entrar en la app para recibir el estado nuevo.
            - paragraph [ref=f28e319]: La notificación puede llegar a dirección, subdirección, secretaría o secretaría-tesorería, pero el permiso efectivo y el alcance de sección son la autorización final.
            - generic [ref=f28e320]:
              - heading "Canal de revisión según el cargo" [level=2] [ref=f28e321]
              - link "Sección titulada «Canal de revisión según el cargo»" [ref=f28e322] [cursor=pointer]:
                - /url: "#canal-de-revisión-según-el-cargo"
            - list [ref=f28e327]:
              - listitem [ref=f28e328]:
                - strong [ref=f28e329]: "Cargos de club:"
                - text: revisan desde
                - strong [ref=f28e330]: Miembros → Solicitudes
                - text: en la app cuando la acción está disponible. El control visual móvil usa
                - code [ref=f28e331]: club_roles:assign
                - text: o
                - code [ref=f28e332]: club_roles:revoke
                - text: ", mientras el backend exige"
                - code [ref=f28e333]: club_members:approve
                - text: en la sección. Dirección recibe ambos permisos en la configuración inicial; subdirección, secretaría y secretaría-tesorería pueden tener autorización backend, pero sus botones quedan ocultos por el control visual actual.
              - listitem [ref=f28e334]:
                - strong [ref=f28e335]: "Roles administrativos o territoriales:"
                - text: revisan desde
                - strong [ref=f28e336]: Solicitudes → Membresía
                - text: en el panel, siempre que su rol sea admitido allí y tengan
                - code [ref=f28e337]: club_members:approve
                - text: en el alcance correspondiente.
            - paragraph [ref=f28e338]: Los canales no son intercambiables. Los cargos de club no obtienen acceso al panel solo por su cargo, y una cuenta administrativa no debe decidir fuera de su alcance territorial. Si una persona autorizada no ve la acción móvil, debe reportar la inconsistencia de acceso.
            - generic [ref=f28e339]:
              - heading "Estados de la solicitud" [level=2] [ref=f28e340]
              - link "Sección titulada «Estados de la solicitud»" [ref=f28e341] [cursor=pointer]:
                - /url: "#estados-de-la-solicitud"
            - paragraph [ref=f28e346]:
              - text: La ruta esperada es
              - code [ref=f28e347]: pending
              - text: →
              - code [ref=f28e348]: active
              - text: .
            - table [ref=f28e349]:
              - rowgroup [ref=f28e350]:
                - row [ref=f28e351]:
                  - columnheader "Estado" [ref=f28e352]
                  - columnheader "Quién lo produce" [ref=f28e353]
                  - columnheader "Qué debe ocurrir después" [ref=f28e354]
              - rowgroup [ref=f28e355]:
