        - generic [ref=f2e218]:
          - generic [ref=f2e219]:
            - paragraph [ref=f2e220]:
              - text: Usa
              - strong [ref=f2e221]: Certificaciones
              - text: para comprobar tu elegibilidad, trabajar los requisitos de una versión publicada y solicitar el cierre institucional.
            - generic [ref=f2e222]:
              - heading "Resultado esperado" [level=2] [ref=f2e223]
              - link "Sección titulada «Resultado esperado»" [ref=f2e224] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f2e229]: Podrás distinguir el borrador de un requisito enviado, atender una solicitud de cambios y completar el cierre sin saltar la revisión final.
            - generic [ref=f2e230]:
              - heading "Quién puede utilizarlo" [level=2] [ref=f2e231]
              - link "Sección titulada «Quién puede utilizarlo»" [ref=f2e232] [cursor=pointer]:
                - /url: "#quién-puede-utilizarlo"
            - paragraph [ref=f2e237]: Los miembros elegibles pueden inscribirse y administrar su propio expediente. Los permisos delegados permiten lectura o gestión según el alcance, pero el participante no puede revisar su propia certificación.
