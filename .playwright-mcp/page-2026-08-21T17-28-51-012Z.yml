            - paragraph [ref=f2e266]:
              - text: Usa el catálogo para empezar y
              - strong [ref=f2e267]: Mis certificaciones
              - text: para retomar trabajo ya guardado.
            - generic [ref=f2e268]:
              - heading "Antes de inscribirte" [level=2] [ref=f2e269]
              - link "Sección titulada «Antes de inscribirte»" [ref=f2e270] [cursor=pointer]:
                - /url: "#antes-de-inscribirte"
            - list [ref=f2e275]:
              - listitem [ref=f2e276]: Abre una certificación del catálogo.
              - listitem [ref=f2e277]:
                - text: Revisa cada condición de la sección
                - strong [ref=f2e278]: Requisitos de inscripción
                - text: .
              - listitem [ref=f2e279]: Confirma que todas aparezcan como cumplidas.
              - listitem [ref=f2e280]:
                - text: Pulsa
                - strong [ref=f2e281]: Inscribirme
                - text: una sola vez.
              - listitem [ref=f2e282]:
                - text: Abre la nueva tarjeta desde
                - strong [ref=f2e283]: Mis certificaciones
                - text: .
            - paragraph [ref=f2e284]: La elegibilidad puede considerar edad, bautismo, clase investida, tipo de club o cargo activo. Si la versión publicada no tiene reglas configuradas, la app deshabilita la inscripción en lugar de asumir que eres elegible.
            - generic [ref=f2e285]:
              - heading "Entender el progreso" [level=2] [ref=f2e286]
              - link "Sección titulada «Entender el progreso»" [ref=f2e287] [cursor=pointer]:
                - /url: "#entender-el-progreso"
            - paragraph [ref=f2e292]: "Cada inscripción queda asociada a una versión específica de la certificación. Los módulos contienen requisitos y cada requisito puede combinar distintos componentes:"
            - list [ref=f2e293]:
              - listitem [ref=f2e294]: respuesta de texto;
              - listitem [ref=f2e295]: declaración o confirmación;
              - listitem [ref=f2e296]: especialidad relacionada;
              - listitem [ref=f2e297]: actividad relacionada;
              - listitem [ref=f2e298]: archivo de evidencia;
              - listitem [ref=f2e299]: validación automática.
            - paragraph [ref=f2e300]: Completa lo que realmente aparece en el requisito. No sustituyas un componente obligatorio con un comentario o archivo en otro espacio.
            - generic [ref=f2e301]:
              - heading "Trabajar un requisito" [level=2] [ref=f2e302]
              - link "Sección titulada «Trabajar un requisito»" [ref=f2e303] [cursor=pointer]:
                - /url: "#trabajar-un-requisito"
            - list [ref=f2e308]:
              - listitem [ref=f2e309]:
                - text: Abre
                - strong [ref=f2e310]: Progreso
                - text: y entra al módulo correspondiente.
              - listitem [ref=f2e311]: Selecciona un requisito en estado editable.
              - listitem [ref=f2e312]: Completa sus respuestas y adjunta la evidencia solicitada.
              - listitem [ref=f2e313]: Guarda el borrador y confirma que la información permanezca al volver.
              - listitem [ref=f2e314]:
                - text: Pulsa
                - strong [ref=f2e315]: Enviar requisito
                - text: cuando todos los componentes estén completos.
              - listitem [ref=f2e316]: Espera la revisión antes de modificarlo nuevamente.
            - table [ref=f2e317]:
