      - main [ref=f8e230]:
        - heading "Alta de cuenta y membresía" [level=1] [ref=f8e233]
        - generic [ref=f8e235]:
          - generic [ref=f8e236]:
            - paragraph [ref=f8e237]: Este proceso comienza en la app, continúa en la sección que revisa la solicitud y termina cuando la membresía queda activa.
            - generic [ref=f8e238]:
              - heading "Resultado esperado" [level=2] [ref=f8e239]
              - link "Sección titulada «Resultado esperado»" [ref=f8e240] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f8e245]: La persona conserva una sola cuenta, completa su perfil, recibe la inscripción anual correspondiente y entra a la sección correcta con una membresía aprobada.
            - generic [ref=f8e246]:
              - heading "No confundas cuenta y membresía" [level=2] [ref=f8e247]
              - link "Sección titulada «No confundas cuenta y membresía»" [ref=f8e248] [cursor=pointer]:
                - /url: "#no-confundas-cuenta-y-membresía"
            - paragraph [ref=f8e253]: "SACDIA maneja registros distintos:"
            - list [ref=f8e254]:
              - listitem [ref=f8e255]:
                - strong [ref=f8e256]: "Cuenta:"
                - text: identidad con correo y contraseña que permite autenticarse.
              - listitem [ref=f8e257]:
                - strong [ref=f8e258]: "Post-registro:"
                - text: foto, datos personales y selección territorial.
              - listitem [ref=f8e259]:
                - strong [ref=f8e260]: "Inscripción anual:"
                - text: vínculo de la persona con una clase progresiva durante el año eclesiástico.
              - listitem [ref=f8e261]:
                - strong [ref=f8e262]: "Membresía:"
                - text: asignación de miembro dentro de una sección, inicialmente
                - code [ref=f8e263]: pending
                - text: .
            - paragraph [ref=f8e264]: Una persona puede iniciar sesión y tener inscripción anual mientras su membresía sigue pendiente. En ese estado ve el tablero restringido, pero no las funciones operativas del club.
            - generic [ref=f8e265]:
              - heading "Participantes" [level=2] [ref=f8e266]
              - link "Sección titulada «Participantes»" [ref=f8e267] [cursor=pointer]:
                - /url: "#participantes"
            - list [ref=f8e272]:
              - listitem [ref=f8e273]: Persona solicitante.
              - listitem [ref=f8e274]: Dirección, subdirección o secretaría de la sección cuando su cargo incluye la revisión.
              - listitem [ref=f8e275]: Personal administrativo para excepciones de cuenta o alcance, no como aprobación global de todos los usuarios.
              - listitem [ref=f8e276]: SACDIA, que deriva clase, controla estados y vence pendientes.
            - generic [ref=f8e277]:
              - heading "Matriz de responsabilidades" [level=2] [ref=f8e278]
              - link "Sección titulada «Matriz de responsabilidades»" [ref=f8e279] [cursor=pointer]:
                - /url: "#matriz-de-responsabilidades"
            - table [ref=f8e284]:
              - rowgroup [ref=f8e285]:
                - row [ref=f8e286]:
                  - columnheader "Etapa" [ref=f8e287]
                  - columnheader "Persona solicitante" [ref=f8e288]
                  - columnheader "Revisor de la sección" [ref=f8e289]
                  - columnheader "Sistema" [ref=f8e290]
              - rowgroup [ref=f8e291]:
                - row [ref=f8e292]:
                  - cell "Cuenta" [ref=f8e293]
                  - cell "Captura datos reales y conserva el correo." [ref=f8e294]
                  - cell "No crea otra cuenta por la persona." [ref=f8e295]
                  - cell "Crea identidad y sesión." [ref=f8e296]
                - row [ref=f8e297]:
                  - cell "Perfil inicial" [ref=f8e298]
                  - cell "Carga foto, datos, contactos y selección correcta." [ref=f8e299]
                  - cell "Orienta sin pedir contraseñas ni datos médicos por canales externos." [ref=f8e300]
                  - cell "Valida los tres pasos." [ref=f8e301]
                - row [ref=f8e302]:
                  - cell "Inscripción anual" [ref=f8e303]
                  - cell "Revisa la clase mostrada." [ref=f8e304]
                  - cell "Corrige excepciones por el proceso autorizado." [ref=f8e305]
                  - cell "Deriva clase por edad/tipo y crea o reactiva el registro anual." [ref=f8e306]
                - row [ref=f8e307]:
                  - cell "Membresía" [ref=f8e308]
                  - cell "Espera, cancela o vuelve a solicitar con la misma cuenta." [ref=f8e309]
                  - cell [ref=f8e310]:
                    - text: Aprueba o rechaza con
                    - code [ref=f8e311]: club_members:approve
                    - text: en su alcance.
                  - cell [ref=f8e312]:
                    - text: Crea la asignación
                    - code [ref=f8e313]: pending
                    - text: ", notifica y actualiza permisos."
            - generic [ref=f8e314]:
              - heading "Flujo completo" [level=2] [ref=f8e315]
              - link "Sección titulada «Flujo completo»" [ref=f8e316] [cursor=pointer]:
                - /url: "#flujo-completo"
            - list [ref=f8e321]:
              - listitem [ref=f8e322]: La persona crea la cuenta y completa los tres pasos en la app.
              - listitem [ref=f8e323]:
                - text: SACDIA deriva la clase y crea o reactiva la
                - strong [ref=f8e324]: inscripción anual
                - text: .
              - listitem [ref=f8e325]:
                - text: En la misma operación crea la asignación de miembro como
                - code [ref=f8e326]: pending
                - text: ", con vencimiento inicial de 8 días."
              - listitem [ref=f8e327]: SACDIA notifica a los cargos revisores configurados de la sección.
              - listitem [ref=f8e328]:
                - text: El revisor abre
                - strong [ref=f8e329]: Solicitudes → Membresía
                - text: y confirma el selector
                - strong [ref=f8e330]: Club · Tipo de sección
                - text: .
              - listitem [ref=f8e331]: Revisa persona, correo, cargo, fecha de solicitud y vencimiento.
              - listitem [ref=f8e332]:
                - text: Con
                - code [ref=f8e333]: club_members:approve
                - text: ", aprueba o rechaza una sola vez."
              - listitem [ref=f8e334]: La solicitud desaparece de la cola y el contexto de autorización de la persona se invalida.
              - listitem [ref=f8e335]: La persona refresca o vuelve a entrar en la app para recibir el estado nuevo.
            - paragraph [ref=f8e336]: La notificación puede llegar a dirección, subdirección, secretaría o secretaría-tesorería, pero el permiso efectivo y el alcance de sección son la autorización final.
            - generic [ref=f8e337]:
              - heading "Estados de la solicitud" [level=2] [ref=f8e338]
              - link "Sección titulada «Estados de la solicitud»" [ref=f8e339] [cursor=pointer]:
                - /url: "#estados-de-la-solicitud"
            - paragraph [ref=f8e344]:
              - text: La ruta esperada es
              - code [ref=f8e345]: pending
              - text: →
              - code [ref=f8e346]: active
              - text: .
            - table [ref=f8e347]:
              - rowgroup [ref=f8e348]:
                - row [ref=f8e349]:
                  - columnheader "Estado" [ref=f8e350]
                  - columnheader "Quién lo produce" [ref=f8e351]
                  - columnheader "Qué debe ocurrir después" [ref=f8e352]
              - rowgroup [ref=f8e353]:
                - row [ref=f8e354]:
                  - cell [ref=f8e355]:
                    - code [ref=f8e356]: pending
                  - cell "SACDIA al finalizar el paso 3." [ref=f8e357]
                  - cell "La sección revisa antes del vencimiento." [ref=f8e358]
                - row [ref=f8e359]:
                  - cell [ref=f8e360]:
                    - code [ref=f8e361]: active
                  - cell "Revisor autorizado." [ref=f8e362]
                  - cell "Se habilitan superficies según cargo y permisos." [ref=f8e363]
                - row [ref=f8e364]:
                  - cell [ref=f8e365]:
                    - code [ref=f8e366]: rejected
                  - cell "Revisor autorizado." [ref=f8e367]
                  - cell "La persona lee el motivo, corrige y vuelve a solicitar." [ref=f8e368]
                - row [ref=f8e369]:
                  - cell [ref=f8e370]:
                    - code [ref=f8e371]: cancelled
                  - cell "Persona solicitante." [ref=f8e372]
                  - cell "Se reabre la selección de club y sección." [ref=f8e373]
                - row [ref=f8e374]:
                  - cell [ref=f8e375]:
                    - code [ref=f8e376]: expired
                  - cell "Proceso automático." [ref=f8e377]
                  - cell "La persona vuelve a solicitar desde la app." [ref=f8e378]
            - paragraph [ref=f8e379]:
              - text: Los pendientes vencen según
              - code [ref=f8e380]: membership.pending_timeout_days
              - text: ; el valor predeterminado es 8 días y la revisión automática se ejecuta cada hora.
            - generic [ref=f8e381]:
              - heading "Corregir sin duplicar" [level=2] [ref=f8e382]
