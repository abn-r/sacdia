            - list [ref=f4e291]:
              - listitem [ref=f4e292]: Confirma la cuenta y el campo local con el que vas a revisar.
              - listitem [ref=f4e293]: Busca por certificación, participante y estado antes de tomar una decisión.
              - listitem [ref=f4e294]: Comprueba que no estás revisando tu propio expediente.
              - listitem [ref=f4e295]: No uses una URL directa para intentar ampliar el alcance.
            - generic [ref=f4e296]:
              - heading "Elegir la bandeja correcta" [level=2] [ref=f4e297]
              - link "Sección titulada «Elegir la bandeja correcta»" [ref=f4e298] [cursor=pointer]:
                - /url: "#elegir-la-bandeja-correcta"
            - paragraph [ref=f4e303]: "La página de revisiones separa dos decisiones que NO son intercambiables:"
            - table [ref=f4e304]:
              - rowgroup [ref=f4e305]:
                - row [ref=f4e306]:
                  - columnheader "Bandeja" [ref=f4e307]
                  - columnheader "Qué recibes" [ref=f4e308]
                  - columnheader "Resultado posible" [ref=f4e309]
              - rowgroup [ref=f4e310]:
                - row [ref=f4e311]:
                  - cell [ref=f4e312]:
                    - strong [ref=f4e313]: Requisitos
                  - cell "Un requisito enviado con respuestas, componentes y evidencias." [ref=f4e314]
                  - cell "Aprobar o solicitar cambios sobre ese requisito." [ref=f4e315]
                - row [ref=f4e316]:
                  - cell [ref=f4e317]:
                    - strong [ref=f4e318]: Cierres
                  - cell "El expediente con requisitos aprobados y comprobante de junta." [ref=f4e319]
                  - cell "Aprobar el comprobante, solicitar cambios o certificar cuando corresponda." [ref=f4e320]
            - paragraph [ref=f4e321]:
              - text: Si buscas una respuesta o archivo de un requisito, usa
              - strong [ref=f4e322]: Requisitos
              - text: . Si la persona ya terminó el programa y presentó el comprobante, usa
              - strong [ref=f4e323]: Cierres
              - text: .
            - generic [ref=f4e324]:
              - heading "Revisar un requisito" [level=2] [ref=f4e325]
              - link "Sección titulada «Revisar un requisito»" [ref=f4e326] [cursor=pointer]:
                - /url: "#revisar-un-requisito"
            - list [ref=f4e331]:
              - listitem [ref=f4e332]:
                - text: Abre
                - strong [ref=f4e333]: Revisiones > Requisitos
                - text: .
              - listitem [ref=f4e334]: Mantén el filtro en enviados o selecciona el estado que necesitas consultar.
              - listitem [ref=f4e335]: Abre el registro y confirma participante, certificación, módulo y requisito.
              - listitem [ref=f4e336]: Revisa todas las respuestas y componentes obligatorios.
              - listitem [ref=f4e337]:
                - text: Pulsa
                - strong [ref=f4e338]: Ver
                - text: para solicitar el acceso temporal a cada evidencia.
              - listitem [ref=f4e339]:
                - text: "Elige una sola resolución:"
                - list [ref=f4e340]:
                  - listitem [ref=f4e341]:
                    - strong [ref=f4e342]: Aprobar
                    - text: ", si el requisito está completo;"
                  - listitem [ref=f4e343]:
                    - strong [ref=f4e344]: Solicitar cambios
                    - text: ", indicando claramente qué debe corregirse."
              - listitem [ref=f4e345]: Actualiza la bandeja y confirma el nuevo estado.
            - paragraph [ref=f4e346]: La URL de descarga de una evidencia se genera al abrirla y tiene duración limitada. No copies el enlace a otro sistema ni lo uses como archivo permanente.
            - generic [ref=f4e347]:
              - heading "Solicitar cambios útiles" [level=2] [ref=f4e348]
              - link "Sección titulada «Solicitar cambios útiles»" [ref=f4e349] [cursor=pointer]:
                - /url: "#solicitar-cambios-útiles"
            - paragraph [ref=f4e354]: "El comentario es obligatorio al devolver un requisito o cierre. Escribe una instrucción que la persona pueda ejecutar:"
            - list [ref=f4e355]:
              - listitem [ref=f4e356]: identifica el componente incompleto;
              - listitem [ref=f4e357]: explica qué evidencia o respuesta falta;
              - listitem [ref=f4e358]: evita comentarios genéricos como “corregir”;
              - listitem [ref=f4e359]: no solicites datos personales que el requisito no exige.
            - paragraph [ref=f4e360]: La persona debe corregir el mismo requisito. No le pidas crear otra inscripción.
            - generic [ref=f4e361]:
              - heading "Resolver el cierre final" [level=2] [ref=f4e362]
              - link "Sección titulada «Resolver el cierre final»" [ref=f4e363] [cursor=pointer]:
                - /url: "#resolver-el-cierre-final"
            - list [ref=f4e368]:
              - listitem [ref=f4e369]:
                - text: Abre
                - strong [ref=f4e370]: Revisiones > Cierres
                - text: .
              - listitem [ref=f4e371]: Selecciona un expediente enviado para revisión final.
              - listitem [ref=f4e372]: Confirma que los requisitos obligatorios estén aprobados.
              - listitem [ref=f4e373]: Abre el comprobante de junta y valida que corresponda al expediente.
              - listitem [ref=f4e374]:
                - text: "Elige:"
                - list [ref=f4e375]:
                  - listitem [ref=f4e376]:
                    - strong [ref=f4e377]: Aprobar comprobante
                    - text: ", si cumple;"
                  - listitem [ref=f4e378]:
                    - strong [ref=f4e379]: Solicitar cambios
                    - text: ", si necesita corrección."
              - listitem [ref=f4e380]:
                - text: Cuando el expediente esté
                - code [ref=f4e381]: APPROVED
                - text: ", pulsa"
                - strong [ref=f4e382]: Certificar
                - text: solo si tienes
                - code [ref=f4e383]: certifications:certify
                - text: .
              - listitem [ref=f4e384]: Confirma la operación y actualiza la fila.
            - paragraph [ref=f4e385]:
              - strong [ref=f4e386]: Aprobar comprobante
              - text: "y"
              - strong [ref=f4e387]: Certificar
