      - main [ref=f15e234]:
        - heading "Solicitudes de membresía" [level=1] [ref=f15e237]
        - generic [ref=f15e239]:
          - generic [ref=f15e240]:
            - paragraph [ref=f15e241]: Esta bandeja corresponde únicamente a las solicitudes de ingreso como miembro. Las solicitudes de cargos y los traslados siguen recorridos separados.
            - generic [ref=f15e242]:
              - heading "Resultado esperado" [level=2] [ref=f15e243]
              - link "Sección titulada «Resultado esperado»" [ref=f15e244] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f15e249]: Podrás revisar la sección correcta, decidir una solicitud pendiente y confirmar que desapareció de la cola sin duplicar asignaciones.
            - generic [ref=f15e250]:
              - heading "Acceso requerido" [level=2] [ref=f15e251]
              - link "Sección titulada «Acceso requerido»" [ref=f15e252] [cursor=pointer]:
                - /url: "#acceso-requerido"
            - list [ref=f15e257]:
              - listitem [ref=f15e258]: Sesión válida en el panel administrativo.
              - listitem [ref=f15e259]:
                - text: Permiso
                - code [ref=f15e260]: club_members:approve
                - text: dentro de la sección que vas a revisar.
            - paragraph [ref=f15e261]: El backend valida el permiso y el alcance de cada decisión. Abrir la ruta no concede acceso a secciones fuera del cargo activo.
            - generic [ref=f15e262]:
              - heading "Ruta incluida" [level=2] [ref=f15e263]
              - link "Sección titulada «Ruta incluida»" [ref=f15e264] [cursor=pointer]:
                - /url: "#ruta-incluida"
            - paragraph [ref=f15e269]:
              - code [ref=f15e270]: /dashboard/requests/membership
            - generic [ref=f15e271]:
              - heading "Reconoce la pantalla" [level=2] [ref=f15e272]
              - link "Sección titulada «Reconoce la pantalla»" [ref=f15e273] [cursor=pointer]:
                - /url: "#reconoce-la-pantalla"
            - figure "Confirma la sección antes de decidir; la bandeja contiene solo solicitudes pendientes y activas del contexto elegido." [ref=f15e278]:
              - img "Panel de Solicitudes de Membresía con selector de sección, contador de pendientes y botón Actualizar" [ref=f15e279]
            - generic [ref=f15e281]:
              - heading "Seleccionar la sección" [level=2] [ref=f15e282]
              - link "Sección titulada «Seleccionar la sección»" [ref=f15e283] [cursor=pointer]:
                - /url: "#seleccionar-la-sección"
            - list [ref=f15e288]:
              - listitem [ref=f15e289]:
                - text: Abre
                - strong [ref=f15e290]: Solicitudes → Membresía
                - text: .
              - listitem [ref=f15e291]:
                - text: Revisa el selector
                - strong [ref=f15e292]: Sección del club
                - text: antes de utilizar la tabla.
              - listitem [ref=f15e293]: El panel selecciona inicialmente la primera sección disponible; no supongas que es la que vas a operar.
              - listitem [ref=f15e294]:
                - text: Elige la opción identificada por
                - strong [ref=f15e295]: Club · Tipo de sección
                - text: .
              - listitem [ref=f15e296]: Espera a que el contador y la tabla terminen de actualizarse.
            - paragraph [ref=f15e297]: Si aparece un error de permisos, confirma tu cargo y el contexto. No intentes resolverlo cambiando manualmente el identificador de la URL.
            - generic [ref=f15e298]:
              - heading "Revisar antes de decidir" [level=2] [ref=f15e299]
              - link "Sección titulada «Revisar antes de decidir»" [ref=f15e300] [cursor=pointer]:
                - /url: "#revisar-antes-de-decidir"
            - paragraph [ref=f15e305]:
              - text: La cola muestra únicamente asignaciones
              - code [ref=f15e306]: pending
              - text: "y activas, ordenadas desde la solicitud más antigua. Antes de actuar, verifica:"
            - list [ref=f15e307]:
              - listitem [ref=f15e308]: nombre y correo de la persona;
              - listitem [ref=f15e309]: cargo solicitado, normalmente miembro;
              - listitem [ref=f15e310]: fecha en que se creó la solicitud;
              - listitem [ref=f15e311]: fecha y hora de vencimiento;
              - listitem [ref=f15e312]: club y sección seleccionados en el filtro.
            - paragraph [ref=f15e313]:
              - text: Un icono de reloj resalta las solicitudes que vencen en menos de
              - strong [ref=f15e314]: 48 horas
              - text: . Priorízalas, pero no apruebes sin confirmar la identidad y la sección.
            - generic [ref=f15e315]:
              - heading "Aprobar" [level=2] [ref=f15e316]
              - link "Sección titulada «Aprobar»" [ref=f15e317] [cursor=pointer]:
                - /url: "#aprobar"
            - list [ref=f15e322]:
              - listitem [ref=f15e323]: Revisa toda la fila.
              - listitem [ref=f15e324]: Pulsa el icono de aprobación una sola vez.
              - listitem [ref=f15e325]: Espera el mensaje de confirmación y la actualización automática de la tabla.
              - listitem [ref=f15e326]: Confirma que la persona ya no aparece en pendientes.
            - paragraph [ref=f15e327]:
              - text: "La aprobación no abre un diálogo de confirmación: el clic envía la decisión inmediatamente. El estado cambia a"
              - code [ref=f15e328]: active
              - text: ", se elimina la fecha de vencimiento y se invalida el contexto de autorización para que la app reciba los permisos del cargo."
            - generic [ref=f15e329]:
              - heading "Rechazar" [level=2] [ref=f15e330]
              - link "Sección titulada «Rechazar»" [ref=f15e331] [cursor=pointer]:
                - /url: "#rechazar"
            - list [ref=f15e336]:
              - listitem [ref=f15e337]: Pulsa el icono de rechazo.
              - listitem [ref=f15e338]: Revisa nuevamente el nombre mostrado en el diálogo.
              - listitem [ref=f15e339]:
                - text: Escribe una razón clara cuando ayude a la persona a corregir la solicitud. El
                - strong [ref=f15e340]: motivo es opcional
                - text: y admite hasta 500 caracteres.
              - listitem [ref=f15e341]:
                - text: Pulsa
                - strong [ref=f15e342]: Rechazar
                - text: y espera la confirmación.
              - listitem [ref=f15e343]: Comprueba que la fila desapareció de la cola.
            - paragraph [ref=f15e344]:
              - text: El estado cambia a
              - code [ref=f15e345]: rejected
              - text: y la app puede mostrar la razón capturada. No incluyas datos médicos, contraseñas ni información que no sea necesaria para corregir el ingreso.
            - generic [ref=f15e346]:
              - heading "Estados y vencimiento" [level=2] [ref=f15e347]
              - link "Sección titulada «Estados y vencimiento»" [ref=f15e348] [cursor=pointer]:
                - /url: "#estados-y-vencimiento"
            - table [ref=f15e353]:
              - rowgroup [ref=f15e354]:
                - row [ref=f15e355]:
                  - columnheader "Estado" [ref=f15e356]
                  - columnheader "Significado" [ref=f15e357]
                  - columnheader "Siguiente acción" [ref=f15e358]
              - rowgroup [ref=f15e359]:
                - row [ref=f15e360]:
                  - cell [ref=f15e361]:
                    - code [ref=f15e362]: pending
                  - cell "La persona terminó el post-registro y espera decisión." [ref=f15e363]
                  - cell "Aprobar o rechazar dentro del plazo." [ref=f15e364]
                - row [ref=f15e365]:
                  - cell [ref=f15e366]:
                    - code [ref=f15e367]: active
                  - cell "La sección aprobó la membresía." [ref=f15e368]
                  - cell "La persona ya puede operar según su cargo." [ref=f15e369]
                - row [ref=f15e370]:
                  - cell [ref=f15e371]:
                    - code [ref=f15e372]: rejected
                  - cell "La solicitud fue rechazada." [ref=f15e373]
                  - cell "La persona corrige y vuelve a solicitar con la misma cuenta." [ref=f15e374]
                - row [ref=f15e375]:
                  - cell [ref=f15e376]:
                    - code [ref=f15e377]: cancelled
                  - cell "La persona canceló su propia solicitud." [ref=f15e378]
                  - cell "Selecciona otra sección desde la app." [ref=f15e379]
                - row [ref=f15e380]:
                  - cell [ref=f15e381]:
                    - code [ref=f15e382]: expired
                  - cell "El plazo terminó sin decisión." [ref=f15e383]
                  - cell "La persona vuelve a solicitar desde la app." [ref=f15e384]
            - paragraph [ref=f15e385]:
              - text: El plazo se configura con
              - code [ref=f15e386]: membership.pending_timeout_days
              - text: y usa
              - strong [ref=f15e387]: 8 días
              - text: cuando no existe una configuración distinta. Un proceso automático revisa cada hora los pendientes antiguos; por eso una fila puede desaparecer sin que alguien pulse aprobar o rechazar.
