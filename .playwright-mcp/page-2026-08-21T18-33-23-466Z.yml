                - row [ref=f37e163]:
                  - cell [ref=f37e164]:
                    - code [ref=f37e165]: active
                  - cell "La sección aprobó la membresía." [ref=f37e166]
                  - cell "La persona ya puede operar según su cargo." [ref=f37e167]
                - row [ref=f37e168]:
                  - cell [ref=f37e169]:
                    - code [ref=f37e170]: rejected
                  - cell "La solicitud fue rechazada." [ref=f37e171]
                  - cell "La persona corrige y vuelve a solicitar si la app muestra la acción; de lo contrario, pide asistencia." [ref=f37e172]
                - row [ref=f37e173]:
                  - cell [ref=f37e174]:
                    - code [ref=f37e175]: cancelled
                  - cell "La persona canceló su propia solicitud." [ref=f37e176]
                  - cell "Selecciona otra sección cuando la app reabra el paso." [ref=f37e177]
                - row [ref=f37e178]:
                  - cell [ref=f37e179]:
                    - code [ref=f37e180]: expired
                  - cell "El plazo terminó sin decisión." [ref=f37e181]
                  - cell "La persona vuelve a solicitar si la app muestra la acción; de lo contrario, pide asistencia." [ref=f37e182]
            - paragraph [ref=f37e183]:
              - text: El plazo se configura con
              - code [ref=f37e184]: membership.pending_timeout_days
              - text: y usa
              - strong [ref=f37e185]: 8 días
              - text: cuando no existe una configuración distinta. Un proceso automático revisa cada hora los pendientes antiguos; por eso una fila puede desaparecer sin que alguien pulse aprobar o rechazar.
            - generic [ref=f37e186]:
              - heading "Limitación de auditoría" [level=2] [ref=f37e187]
              - link "Sección titulada «Limitación de auditoría»" [ref=f37e188] [cursor=pointer]:
                - /url: "#limitación-de-auditoría"
            - paragraph [ref=f37e193]:
              - text: La asignación guarda el estado, el motivo de rechazo y actualiza
              - code [ref=f37e194]: modified_at
              - text: "al decidir. Esa marca conserva la hora de la última modificación, pero no demuestra por sí sola qué operación ocurrió ni quién la realizó: el modelo no persiste al actor ni campos semánticos"
              - code [ref=f37e195]: approved_at
              - text: o
              - code [ref=f37e196]: rejected_at
              - text: . No uses esta bandeja como única evidencia de autoría; si el procedimiento institucional exige trazabilidad nominal, registra el respaldo en el canal autorizado hasta que existan esos campos en SACDIA.
            - generic [ref=f37e197]:
              - heading "Cómo verificarlo" [level=2] [ref=f37e198]
              - link "Sección titulada «Cómo verificarlo»" [ref=f37e199] [cursor=pointer]:
                - /url: "#cómo-verificarlo"
            - paragraph [ref=f37e204]:
              - text: Pulsa
              - strong [ref=f37e205]: Actualizar
              - text: y confirma que la solicitud ya no aparece en la sección. Después de aprobar, la persona debe refrescar o volver a entrar y comprobar que la membresía quedó
              - code [ref=f37e206]: active
              - text: . En cambio, un rechazo o vencimiento puede no mostrar un aviso ni las acciones de corrección en una cuenta nueva; si ocurre, conserva la cuenta y utiliza el canal de soporte documentado.
