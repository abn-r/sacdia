        - heading "Solicitudes de membresía" [level=1] [ref=f37e34]
        - generic [ref=f37e36]:
          - generic [ref=f37e37]:
            - paragraph [ref=f37e38]: Esta bandeja corresponde únicamente a las solicitudes de ingreso como miembro. Las solicitudes de cargos y los traslados siguen recorridos separados.
            - generic [ref=f37e39]:
              - heading "Resultado esperado" [level=2] [ref=f37e40]
              - link "Sección titulada «Resultado esperado»" [ref=f37e41] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f37e46]: Podrás revisar la sección correcta, decidir una solicitud pendiente y confirmar que desapareció de la cola sin duplicar asignaciones.
            - generic [ref=f37e47]:
              - heading "Acceso requerido" [level=2] [ref=f37e48]
              - link "Sección titulada «Acceso requerido»" [ref=f37e49] [cursor=pointer]:
                - /url: "#acceso-requerido"
            - list [ref=f37e54]:
              - listitem [ref=f37e55]: Sesión válida y un rol admitido en el panel administrativo.
              - listitem [ref=f37e56]:
                - text: Permiso
                - code [ref=f37e57]: club_members:approve
                - text: dentro de la sección que vas a revisar.
            - paragraph [ref=f37e58]:
              - text: "Los cargos de club no obtienen acceso al panel solo por su cargo: deben revisar desde"
              - strong [ref=f37e59]: Miembros → Solicitudes
              - text: en la app cuando esa superficie muestre la acción. El backend valida el permiso y el alcance de cada decisión. Abrir la ruta no concede acceso a secciones fuera del cargo activo.
            - generic [ref=f37e60]:
              - heading "Ruta incluida" [level=2] [ref=f37e61]
              - link "Sección titulada «Ruta incluida»" [ref=f37e62] [cursor=pointer]:
                - /url: "#ruta-incluida"
            - paragraph [ref=f37e67]:
              - code [ref=f37e68]: /dashboard/requests/membership
            - generic [ref=f37e69]:
              - heading "Reconoce la pantalla" [level=2] [ref=f37e70]
              - link "Sección titulada «Reconoce la pantalla»" [ref=f37e71] [cursor=pointer]:
                - /url: "#reconoce-la-pantalla"
            - figure "Confirma la sección antes de decidir; la bandeja contiene solo solicitudes pendientes y activas del contexto elegido." [ref=f37e76]:
              - img "Panel de Solicitudes de Membresía con selector de sección, contador de pendientes y botón Actualizar" [ref=f37e77]
            - generic [ref=f37e79]:
              - heading "Seleccionar la sección" [level=2] [ref=f37e80]
              - link "Sección titulada «Seleccionar la sección»" [ref=f37e81] [cursor=pointer]:
                - /url: "#seleccionar-la-sección"
            - list [ref=f37e86]:
              - listitem [ref=f37e87]:
                - text: Abre
                - strong [ref=f37e88]: Solicitudes → Membresía
                - text: .
              - listitem [ref=f37e89]:
                - text: Revisa el selector
                - strong [ref=f37e90]: Sección del club
                - text: antes de utilizar la tabla.
              - listitem [ref=f37e91]: El panel selecciona inicialmente la primera sección disponible; no supongas que es la que vas a operar.
              - listitem [ref=f37e92]:
                - text: Elige la opción identificada por
                - strong [ref=f37e93]: Club · Tipo de sección
                - text: .
              - listitem [ref=f37e94]: Espera a que el contador y la tabla terminen de actualizarse.
            - paragraph [ref=f37e95]: Si aparece un error de permisos, confirma tu cargo y el contexto. No intentes resolverlo cambiando manualmente el identificador de la URL.
            - generic [ref=f37e96]:
              - heading "Revisar antes de decidir" [level=2] [ref=f37e97]
              - link "Sección titulada «Revisar antes de decidir»" [ref=f37e98] [cursor=pointer]:
                - /url: "#revisar-antes-de-decidir"
            - paragraph [ref=f37e103]:
              - text: La cola muestra únicamente asignaciones
              - code [ref=f37e104]: pending
              - text: "y activas, ordenadas desde la solicitud más antigua. Antes de actuar, verifica:"
            - list [ref=f37e105]:
              - listitem [ref=f37e106]: nombre y correo de la persona;
              - listitem [ref=f37e107]: cargo solicitado, normalmente miembro;
              - listitem [ref=f37e108]: fecha en que se creó la solicitud;
              - listitem [ref=f37e109]: fecha y hora de vencimiento;
              - listitem [ref=f37e110]: club y sección seleccionados en el filtro.
            - paragraph [ref=f37e111]:
              - text: Un icono de reloj resalta las solicitudes que vencen en menos de
              - strong [ref=f37e112]: 48 horas
              - text: . Priorízalas, pero no apruebes sin confirmar la identidad y la sección.
            - generic [ref=f37e113]:
              - heading "Aprobar" [level=2] [ref=f37e114]
              - link "Sección titulada «Aprobar»" [ref=f37e115] [cursor=pointer]:
                - /url: "#aprobar"
            - list [ref=f37e120]:
              - listitem [ref=f37e121]: Revisa toda la fila.
              - listitem [ref=f37e122]: Pulsa el icono de aprobación una sola vez.
              - listitem [ref=f37e123]: Espera el mensaje de confirmación y la actualización automática de la tabla.
              - listitem [ref=f37e124]: Confirma que la persona ya no aparece en pendientes.
            - paragraph [ref=f37e125]:
              - text: "La aprobación no abre un diálogo de confirmación: el clic envía la decisión inmediatamente. El estado cambia a"
              - code [ref=f37e126]: active
              - text: ", se elimina la fecha de vencimiento y se invalida el contexto de autorización para que la app reciba los permisos del cargo."
            - generic [ref=f37e127]:
              - heading "Rechazar" [level=2] [ref=f37e128]
              - link "Sección titulada «Rechazar»" [ref=f37e129] [cursor=pointer]:
                - /url: "#rechazar"
            - list [ref=f37e134]:
              - listitem [ref=f37e135]: Pulsa el icono de rechazo.
              - listitem [ref=f37e136]: Revisa nuevamente el nombre mostrado en el diálogo.
              - listitem [ref=f37e137]:
                - text: Escribe una razón clara cuando ayude a la persona a corregir la solicitud. El
                - strong [ref=f37e138]: motivo es opcional
                - text: y admite hasta 500 caracteres.
              - listitem [ref=f37e139]:
                - text: Pulsa
                - strong [ref=f37e140]: Rechazar
                - text: y espera la confirmación.
              - listitem [ref=f37e141]: Comprueba que la fila desapareció de la cola.
            - paragraph [ref=f37e142]:
              - text: El estado cambia a
              - code [ref=f37e143]: rejected
              - text: y la app puede mostrar la razón capturada. No incluyas datos médicos, contraseñas ni información que no sea necesaria para corregir el ingreso.
            - generic [ref=f37e144]:
              - heading "Estados y vencimiento" [level=2] [ref=f37e145]
              - link "Sección titulada «Estados y vencimiento»" [ref=f37e146] [cursor=pointer]:
