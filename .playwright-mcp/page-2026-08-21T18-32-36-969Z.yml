      - main [ref=f25e211]:
        - heading "Acceso, registro y recuperación" [level=1] [ref=f25e214]
        - generic [ref=f25e216]:
          - generic [ref=f25e217]:
            - paragraph [ref=f25e218]: Utiliza esta guía cuando abras SACDIA sin una sesión activa.
            - generic [ref=f25e219]:
              - heading "Resultado esperado" [level=2] [ref=f25e220]
              - link "Sección titulada «Resultado esperado»" [ref=f25e221] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f25e226]: Podrás entrar con una cuenta existente, crear una nueva o solicitar la recuperación de la contraseña sin duplicar usuarios.
            - generic [ref=f25e227]:
              - heading "Quién puede utilizarlo" [level=2] [ref=f25e228]
              - link "Sección titulada «Quién puede utilizarlo»" [ref=f25e229] [cursor=pointer]:
                - /url: "#quién-puede-utilizarlo"
            - list [ref=f25e234]:
              - listitem [ref=f25e235]: Personas que todavía no tienen cuenta.
              - listitem [ref=f25e236]: Usuarios registrados que necesitan iniciar sesión.
              - listitem [ref=f25e237]: Usuarios que olvidaron su contraseña.
            - paragraph [ref=f25e238]:
              - text: La pantalla vigente ofrece acceso con
              - strong [ref=f25e239]: correo y contraseña
              - text: . Aunque el sistema tiene infraestructura para Google y Apple, esos botones no aparecen en el inicio de sesión actual; no los presentes como una opción disponible.
            - generic [ref=f25e240]:
              - heading "Pantallas incluidas" [level=2] [ref=f25e241]
              - link "Sección titulada «Pantallas incluidas»" [ref=f25e242] [cursor=pointer]:
                - /url: "#pantallas-incluidas"
            - list [ref=f25e247]:
              - listitem [ref=f25e248]: Inicio de sesión.
              - listitem [ref=f25e249]: Registro.
              - listitem [ref=f25e250]: Recuperar contraseña.
              - listitem [ref=f25e251]: Pantalla de carga que decide el siguiente destino.
            - generic [ref=f25e252]:
              - heading "Elegir el acceso correcto" [level=2] [ref=f25e253]
              - link "Sección titulada «Elegir el acceso correcto»" [ref=f25e254] [cursor=pointer]:
                - /url: "#elegir-el-acceso-correcto"
            - table [ref=f25e259]:
              - rowgroup [ref=f25e260]:
                - row [ref=f25e261]:
                  - columnheader "Situación" [ref=f25e262]
                  - columnheader "Acción correcta" [ref=f25e263]
              - rowgroup [ref=f25e264]:
                - row [ref=f25e265]:
                  - cell "Ya tienes una cuenta" [ref=f25e266]
                  - cell "Escribe el mismo correo con el que te registraste y tu contraseña." [ref=f25e267]
                - row [ref=f25e268]:
                  - cell "Nunca has utilizado SACDIA" [ref=f25e269]
                  - cell [ref=f25e270]:
                    - text: Pulsa
                    - strong [ref=f25e271]: Regístrate
                    - text: y crea una sola cuenta.
                - row [ref=f25e272]:
                  - cell "Olvidaste la contraseña" [ref=f25e273]
                  - cell [ref=f25e274]:
                    - text: Pulsa
                    - strong [ref=f25e275]: ¿Olvidaste tu contraseña?
                    - text: ; no abras otra cuenta.
                - row [ref=f25e276]:
                  - cell "Te registraste pero no terminaste el perfil" [ref=f25e277]
                  - cell "Inicia sesión normalmente. La app retomará el post-registro pendiente." [ref=f25e278]
                - row [ref=f25e279]:
                  - cell "Tu membresía fue rechazada o venció" [ref=f25e280]
                  - cell [ref=f25e281]:
                    - text: Entra con la cuenta existente. Si la app no muestra
                    - strong [ref=f25e282]: Volver a solicitar
                    - text: ", pide apoyo a una persona autorizada del club o a soporte; no abras otra cuenta."
            - generic [ref=f25e283]:
              - heading "Crear una cuenta" [level=2] [ref=f25e284]
              - link "Sección titulada «Crear una cuenta»" [ref=f25e285] [cursor=pointer]:
                - /url: "#crear-una-cuenta"
            - list [ref=f25e290]:
              - listitem [ref=f25e291]:
                - text: Desde
                - strong [ref=f25e292]: Iniciar sesión
                - text: ", pulsa"
                - strong [ref=f25e293]: Regístrate
                - text: .
              - listitem [ref=f25e294]: Captura nombre, apellido paterno y apellido materno.
              - listitem [ref=f25e295]: Escribe un correo al que tengas acceso. Será tu identificador para entrar y recuperar la contraseña.
              - listitem [ref=f25e296]: Crea una contraseña de al menos ocho caracteres con mayúscula, minúscula, número y carácter especial.
              - listitem [ref=f25e297]: Repite exactamente la contraseña.
              - listitem [ref=f25e298]:
                - text: Pulsa
                - strong [ref=f25e299]: Crear cuenta
                - text: una sola vez y espera la confirmación.
            - paragraph [ref=f25e300]: El botón se habilita cuando todos los campos están completos, el correo tiene formato válido y ambas contraseñas coinciden. Después del registro, la sesión queda iniciada y la app dirige al perfil inicial de tres pasos.
            - generic [ref=f25e301]:
              - heading "Iniciar sesión" [level=2] [ref=f25e302]
              - link "Sección titulada «Iniciar sesión»" [ref=f25e303] [cursor=pointer]:
                - /url: "#iniciar-sesión"
            - list [ref=f25e308]:
              - listitem [ref=f25e309]: Escribe tu correo completo y revisa que no tenga espacios.
              - listitem [ref=f25e310]: Captura la contraseña respetando mayúsculas y minúsculas.
              - listitem [ref=f25e311]:
                - text: Pulsa
                - strong [ref=f25e312]: Iniciar sesión
                - text: y espera el resultado antes de volver a intentarlo.
            - paragraph [ref=f25e313]:
              - text: Después de tres intentos fallidos consecutivos, la pantalla bloquea temporalmente el botón durante
              - strong [ref=f25e314]: 30 segundos
              - text: ". No uses ese tiempo para crear otra cuenta: revisa el correo o inicia la recuperación."
            - generic [ref=f25e315]:
              - heading "Recuperar la contraseña" [level=2] [ref=f25e316]
              - link "Sección titulada «Recuperar la contraseña»" [ref=f25e317] [cursor=pointer]:
                - /url: "#recuperar-la-contraseña"
            - list [ref=f25e322]:
              - listitem [ref=f25e323]:
                - text: Pulsa
                - strong [ref=f25e324]: ¿Olvidaste tu contraseña?
                - text: .
              - listitem [ref=f25e325]: Escribe el correo registrado.
              - listitem [ref=f25e326]:
                - text: Pulsa
                - strong [ref=f25e327]: Enviar instrucciones
                - text: .
              - listitem [ref=f25e328]: Cuando aparezca la confirmación, revisa la bandeja de entrada y correo no deseado.
              - listitem [ref=f25e329]: Abre el enlace recibido y define la nueva contraseña.
              - listitem [ref=f25e330]: Regresa a la app e inicia sesión con la contraseña nueva.
            - paragraph [ref=f25e331]: Si no recibes el mensaje, confirma primero que escribiste el mismo correo de la cuenta. Repetir la solicitud no corrige un correo distinto.
            - generic [ref=f25e332]:
              - heading "Después de autenticarte" [level=2] [ref=f25e333]
              - link "Sección titulada «Después de autenticarte»" [ref=f25e334] [cursor=pointer]:
                - /url: "#después-de-autenticarte"
            - paragraph [ref=f25e339]: "La pantalla de carga revisa el estado del perfil:"
            - list [ref=f25e340]:
              - listitem [ref=f25e341]:
                - text: si el post-registro está incompleto, abre
                - strong [ref=f25e342]: Completar perfil
                - text: en el paso pendiente;
              - listitem [ref=f25e343]: si ya está completo, abre el tablero;
              - listitem [ref=f25e344]:
                - text: si la membresía sigue
                - code [ref=f25e345]: pending
                - text: ", el tablero muestra el estado, pero oculta las superficies operativas del club hasta que la solicitud quede activa."
            - paragraph [ref=f25e346]: Tener una sesión válida no significa que la membresía de club ya fue aprobada. Son estados diferentes.
            - generic [ref=f25e347]:
              - heading "Cómo verificarlo" [level=2] [ref=f25e348]
              - link "Sección titulada «Cómo verificarlo»" [ref=f25e349] [cursor=pointer]:
                - /url: "#cómo-verificarlo"
            - paragraph [ref=f25e354]: La app deja la pantalla de acceso y abre el post-registro o el tablero correspondiente a la misma cuenta.
