      - main [ref=f32e232]:
        - heading "Alta de cuenta y membresía" [level=1] [ref=f32e235]
        - generic [ref=f32e237]:
          - generic [ref=f32e238]:
            - paragraph [ref=f32e239]: Este proceso comienza en la app, continúa en la sección que revisa la solicitud y termina cuando la membresía queda activa.
            - generic [ref=f32e240]:
              - heading "Resultado esperado" [level=2] [ref=f32e241]
              - link "Sección titulada «Resultado esperado»" [ref=f32e242] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f32e247]: La persona conserva una sola cuenta, completa su perfil, recibe la inscripción anual correspondiente y entra a la sección correcta con una membresía aprobada.
            - generic [ref=f32e248]:
              - heading "No confundas cuenta y membresía" [level=2] [ref=f32e249]
              - link "Sección titulada «No confundas cuenta y membresía»" [ref=f32e250] [cursor=pointer]:
                - /url: "#no-confundas-cuenta-y-membresía"
            - paragraph [ref=f32e255]: "SACDIA maneja registros distintos:"
            - list [ref=f32e256]:
              - listitem [ref=f32e257]:
                - strong [ref=f32e258]: "Cuenta:"
                - text: identidad con correo y contraseña que permite autenticarse.
              - listitem [ref=f32e259]:
                - strong [ref=f32e260]: "Post-registro:"
                - text: foto, datos personales y selección territorial.
              - listitem [ref=f32e261]:
                - strong [ref=f32e262]: "Inscripción anual:"
                - text: vínculo de la persona con una clase progresiva durante el año eclesiástico.
              - listitem [ref=f32e263]:
                - strong [ref=f32e264]: "Membresía:"
                - text: asignación de miembro dentro de una sección, inicialmente
                - code [ref=f32e265]: pending
                - text: .
            - paragraph [ref=f32e266]: Una persona puede iniciar sesión y tener inscripción anual mientras su membresía sigue pendiente. En ese estado ve el tablero restringido, pero no las funciones operativas del club.
            - generic [ref=f32e267]:
              - heading "Participantes" [level=2] [ref=f32e268]
              - link "Sección titulada «Participantes»" [ref=f32e269] [cursor=pointer]:
                - /url: "#participantes"
            - list [ref=f32e274]:
              - listitem [ref=f32e275]: Persona solicitante.
              - listitem [ref=f32e276]: Dirección, subdirección o secretaría de la sección cuando cuenta con los permisos efectivos para revisar desde la app.
              - listitem [ref=f32e277]: Personal administrativo o territorial admitido en el panel y con alcance sobre la sección.
              - listitem [ref=f32e278]: SACDIA, que deriva clase, controla estados y vence pendientes.
            - generic [ref=f32e279]:
              - heading "Matriz de responsabilidades" [level=2] [ref=f32e280]
              - link "Sección titulada «Matriz de responsabilidades»" [ref=f32e281] [cursor=pointer]:
                - /url: "#matriz-de-responsabilidades"
            - table [ref=f32e286]:
              - rowgroup [ref=f32e287]:
                - row [ref=f32e288]:
                  - columnheader "Etapa" [ref=f32e289]
                  - columnheader "Persona solicitante" [ref=f32e290]
                  - columnheader "Revisor de la sección" [ref=f32e291]
                  - columnheader "Sistema" [ref=f32e292]
              - rowgroup [ref=f32e293]:
                - row [ref=f32e294]:
                  - cell "Cuenta" [ref=f32e295]
                  - cell "Captura datos reales y conserva el correo." [ref=f32e296]
                  - cell "No crea otra cuenta por la persona." [ref=f32e297]
                  - cell "Crea identidad y sesión." [ref=f32e298]
                - row [ref=f32e299]:
                  - cell "Perfil inicial" [ref=f32e300]
                  - cell "Carga foto, datos, contactos y selección correcta." [ref=f32e301]
                  - cell "Orienta sin pedir contraseñas ni datos médicos por canales externos." [ref=f32e302]
                  - cell "Valida los tres pasos." [ref=f32e303]
                - row [ref=f32e304]:
                  - cell "Inscripción anual" [ref=f32e305]
                  - cell "Revisa la clase mostrada." [ref=f32e306]
                  - cell "Corrige excepciones por el proceso autorizado." [ref=f32e307]
                  - cell "Deriva clase por edad/tipo y crea o reactiva el registro anual." [ref=f32e308]
                - row [ref=f32e309]:
                  - cell "Membresía" [ref=f32e310]
                  - cell "Espera y conserva la misma cuenta; cancela o vuelve a solicitar solo si la app muestra la acción." [ref=f32e311]
                  - cell [ref=f32e312]:
                    - text: Aprueba o rechaza con
                    - code [ref=f32e313]: club_members:approve
                    - text: en su alcance.
                  - cell [ref=f32e314]:
                    - text: Crea la asignación
                    - code [ref=f32e315]: pending
                    - text: ", notifica y actualiza permisos."
            - generic [ref=f32e316]:
              - heading "Flujo completo" [level=2] [ref=f32e317]
              - link "Sección titulada «Flujo completo»" [ref=f32e318] [cursor=pointer]:
                - /url: "#flujo-completo"
            - list [ref=f32e323]:
              - listitem [ref=f32e324]: La persona crea la cuenta y completa los tres pasos en la app.
              - listitem [ref=f32e325]:
                - text: SACDIA deriva la clase y crea o reactiva la
                - strong [ref=f32e326]: inscripción anual
                - text: .
              - listitem [ref=f32e327]:
                - text: En la misma operación crea la asignación de miembro como
                - code [ref=f32e328]: pending
                - text: ", con vencimiento inicial de 8 días."
              - listitem [ref=f32e329]: SACDIA notifica a los cargos revisores configurados de la sección.
              - listitem [ref=f32e330]: "El revisor elige el canal permitido por su cargo: app para cargos de club o panel para roles administrativos y territoriales."
              - listitem [ref=f32e331]:
                - text: En el panel, abre
                - strong [ref=f32e332]: Solicitudes → Membresía
                - text: y confirma el selector
                - strong [ref=f32e333]: Club · Tipo de sección
                - text: .
              - listitem [ref=f32e334]: Revisa persona, correo, cargo, fecha de solicitud y vencimiento.
              - listitem [ref=f32e335]:
                - text: Con
                - code [ref=f32e336]: club_members:approve
                - text: ", aprueba o rechaza una sola vez."
              - listitem [ref=f32e337]: La solicitud desaparece de la cola y el contexto de autorización de la persona se invalida.
              - listitem [ref=f32e338]: La persona refresca o vuelve a entrar en la app para recibir el estado nuevo.
            - paragraph [ref=f32e339]: La notificación puede llegar a dirección, subdirección, secretaría o secretaría-tesorería, pero el permiso efectivo y el alcance de sección son la autorización final.
            - generic [ref=f32e340]:
              - heading "Canal de revisión según el cargo" [level=2] [ref=f32e341]
              - link "Sección titulada «Canal de revisión según el cargo»" [ref=f32e342] [cursor=pointer]:
                - /url: "#canal-de-revisión-según-el-cargo"
            - list [ref=f32e347]:
              - listitem [ref=f32e348]:
                - strong [ref=f32e349]: "Cargos de club:"
                - text: revisan desde
                - strong [ref=f32e350]: Miembros → Solicitudes
                - text: en la app cuando la acción está disponible. El control visual móvil usa
                - code [ref=f32e351]: club_roles:assign
                - text: o
                - code [ref=f32e352]: club_roles:revoke
                - text: ", pero el backend exige"
                - code [ref=f32e353]: club_members:approve
                - text: en la sección. Dirección recibe ambos permisos en la configuración inicial; subdirección, secretaría y secretaría-tesorería pueden tener autorización backend, pero sus botones quedan ocultos por el control visual actual.
              - listitem [ref=f32e354]:
                - strong [ref=f32e355]: "Roles administrativos o territoriales:"
                - text: utilizan la ruta del panel descrita en esta guía. Además de un rol admitido en el panel, necesitan
                - code [ref=f32e356]: club_members:approve
                - text: en el alcance correspondiente.
            - paragraph [ref=f32e357]: Los canales no son intercambiables. Los cargos de club no obtienen acceso al panel solo por su cargo. Si una persona autorizada por backend no ve los botones en la app, debe reportar la inconsistencia de acceso; no debe intentar resolverla entrando al panel.
            - generic [ref=f32e358]:
              - heading "Estados de la solicitud" [level=2] [ref=f32e359]
              - link "Sección titulada «Estados de la solicitud»" [ref=f32e360] [cursor=pointer]:
                - /url: "#estados-de-la-solicitud"
            - paragraph [ref=f32e365]:
              - text: La ruta esperada es
              - code [ref=f32e366]: pending
              - text: →
              - code [ref=f32e367]: active
              - text: .
            - table [ref=f32e368]:
              - rowgroup [ref=f32e369]:
