      - main [ref=f30e234]:
        - heading "Solicitudes de membresía" [level=1] [ref=f30e237]
        - generic [ref=f30e239]:
          - generic [ref=f30e240]:
            - paragraph [ref=f30e241]: Esta bandeja corresponde únicamente a las solicitudes de ingreso como miembro. Las solicitudes de cargos y los traslados siguen recorridos separados.
            - generic [ref=f30e242]:
              - heading "Resultado esperado" [level=2] [ref=f30e243]
              - link "Sección titulada «Resultado esperado»" [ref=f30e244] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f30e249]: Podrás revisar la sección correcta, decidir una solicitud pendiente y confirmar que desapareció de la cola sin duplicar asignaciones.
            - generic [ref=f30e250]:
              - heading "Acceso requerido" [level=2] [ref=f30e251]
              - link "Sección titulada «Acceso requerido»" [ref=f30e252] [cursor=pointer]:
                - /url: "#acceso-requerido"
            - list [ref=f30e257]:
              - listitem [ref=f30e258]: Sesión válida y un rol admitido en el panel administrativo.
              - listitem [ref=f30e259]:
                - text: Permiso
                - code [ref=f30e260]: club_members:approve
                - text: dentro de la sección que vas a revisar.
            - paragraph [ref=f30e261]:
              - text: "Los cargos de club no obtienen acceso al panel solo por su cargo: deben revisar desde"
              - strong [ref=f30e262]: Miembros → Solicitudes
              - text: en la app cuando esa superficie muestre la acción. El backend valida el permiso y el alcance de cada decisión. Abrir la ruta no concede acceso a secciones fuera del cargo activo.
            - generic [ref=f30e263]:
              - heading "Ruta incluida" [level=2] [ref=f30e264]
              - link "Sección titulada «Ruta incluida»" [ref=f30e265] [cursor=pointer]:
                - /url: "#ruta-incluida"
            - paragraph [ref=f30e270]:
              - code [ref=f30e271]: /dashboard/requests/membership
            - generic [ref=f30e272]:
              - heading "Reconoce la pantalla" [level=2] [ref=f30e273]
              - link "Sección titulada «Reconoce la pantalla»" [ref=f30e274] [cursor=pointer]:
                - /url: "#reconoce-la-pantalla"
            - figure "Confirma la sección antes de decidir; la bandeja contiene solo solicitudes pendientes y activas del contexto elegido." [ref=f30e279]:
              - img "Panel de Solicitudes de Membresía con selector de sección, contador de pendientes y botón Actualizar" [ref=f30e280]
            - generic [ref=f30e282]:
              - heading "Seleccionar la sección" [level=2] [ref=f30e283]
              - link "Sección titulada «Seleccionar la sección»" [ref=f30e284] [cursor=pointer]:
                - /url: "#seleccionar-la-sección"
            - list [ref=f30e289]:
              - listitem [ref=f30e290]:
                - text: Abre
                - strong [ref=f30e291]: Solicitudes → Membresía
                - text: .
              - listitem [ref=f30e292]:
                - text: Revisa el selector
                - strong [ref=f30e293]: Sección del club
                - text: antes de utilizar la tabla.
              - listitem [ref=f30e294]: El panel selecciona inicialmente la primera sección disponible; no supongas que es la que vas a operar.
              - listitem [ref=f30e295]:
                - text: Elige la opción identificada por
                - strong [ref=f30e296]: Club · Tipo de sección
                - text: .
              - listitem [ref=f30e297]: Espera a que el contador y la tabla terminen de actualizarse.
            - paragraph [ref=f30e298]: Si aparece un error de permisos, confirma tu cargo y el contexto. No intentes resolverlo cambiando manualmente el identificador de la URL.
            - generic [ref=f30e299]:
              - heading "Revisar antes de decidir" [level=2] [ref=f30e300]
              - link "Sección titulada «Revisar antes de decidir»" [ref=f30e301] [cursor=pointer]:
                - /url: "#revisar-antes-de-decidir"
            - paragraph [ref=f30e306]:
              - text: La cola muestra únicamente asignaciones
              - code [ref=f30e307]: pending
              - text: "y activas, ordenadas desde la solicitud más antigua. Antes de actuar, verifica:"
            - list [ref=f30e308]:
              - listitem [ref=f30e309]: nombre y correo de la persona;
              - listitem [ref=f30e310]: cargo solicitado, normalmente miembro;
              - listitem [ref=f30e311]: fecha en que se creó la solicitud;
              - listitem [ref=f30e312]: fecha y hora de vencimiento;
              - listitem [ref=f30e313]: club y sección seleccionados en el filtro.
            - paragraph [ref=f30e314]:
              - text: Un icono de reloj resalta las solicitudes que vencen en menos de
              - strong [ref=f30e315]: 48 horas
              - text: . Priorízalas, pero no apruebes sin confirmar la identidad y la sección.
            - generic [ref=f30e316]:
              - heading "Aprobar" [level=2] [ref=f30e317]
              - link "Sección titulada «Aprobar»" [ref=f30e318] [cursor=pointer]:
                - /url: "#aprobar"
            - list [ref=f30e323]:
              - listitem [ref=f30e324]: Revisa toda la fila.
              - listitem [ref=f30e325]: Pulsa el icono de aprobación una sola vez.
              - listitem [ref=f30e326]: Espera el mensaje de confirmación y la actualización automática de la tabla.
              - listitem [ref=f30e327]: Confirma que la persona ya no aparece en pendientes.
            - paragraph [ref=f30e328]:
              - text: "La aprobación no abre un diálogo de confirmación: el clic envía la decisión inmediatamente. El estado cambia a"
              - code [ref=f30e329]: active
              - text: ", se elimina la fecha de vencimiento y se invalida el contexto de autorización para que la app reciba los permisos del cargo."
            - generic [ref=f30e330]:
              - heading "Rechazar" [level=2] [ref=f30e331]
              - link "Sección titulada «Rechazar»" [ref=f30e332] [cursor=pointer]:
                - /url: "#rechazar"
            - list [ref=f30e337]:
              - listitem [ref=f30e338]: Pulsa el icono de rechazo.
              - listitem [ref=f30e339]: Revisa nuevamente el nombre mostrado en el diálogo.
              - listitem [ref=f30e340]:
                - text: Escribe una razón clara cuando ayude a la persona a corregir la solicitud. El
                - strong [ref=f30e341]: motivo es opcional
                - text: y admite hasta 500 caracteres.
              - listitem [ref=f30e342]:
                - text: Pulsa
                - strong [ref=f30e343]: Rechazar
                - text: y espera la confirmación.
              - listitem [ref=f30e344]: Comprueba que la fila desapareció de la cola.
            - paragraph [ref=f30e345]:
              - text: El estado cambia a
              - code [ref=f30e346]: rejected
              - text: y la app puede mostrar la razón capturada. No incluyas datos médicos, contraseñas ni información que no sea necesaria para corregir el ingreso.
            - generic [ref=f30e347]:
              - heading "Estados y vencimiento" [level=2] [ref=f30e348]
              - link "Sección titulada «Estados y vencimiento»" [ref=f30e349] [cursor=pointer]:
                - /url: "#estados-y-vencimiento"
            - table [ref=f30e354]:
              - rowgroup [ref=f30e355]:
                - row [ref=f30e356]:
                  - columnheader "Estado" [ref=f30e357]
                  - columnheader "Significado" [ref=f30e358]
                  - columnheader "Siguiente acción" [ref=f30e359]
              - rowgroup [ref=f30e360]:
                - row [ref=f30e361]:
                  - cell [ref=f30e362]:
                    - code [ref=f30e363]: pending
                  - cell "La persona terminó el post-registro y espera decisión." [ref=f30e364]
                  - cell "Aprobar o rechazar dentro del plazo." [ref=f30e365]
                - row [ref=f30e366]:
                  - cell [ref=f30e367]:
                    - code [ref=f30e368]: active
                  - cell "La sección aprobó la membresía." [ref=f30e369]
                  - cell "La persona ya puede operar según su cargo." [ref=f30e370]
                - row [ref=f30e371]:
                  - cell [ref=f30e372]:
                    - code [ref=f30e373]: rejected
                  - cell "La solicitud fue rechazada." [ref=f30e374]
                  - cell "La persona corrige y vuelve a solicitar si la app muestra la acción; de lo contrario, pide asistencia." [ref=f30e375]
                - row [ref=f30e376]:
                  - cell [ref=f30e377]:
                    - code [ref=f30e378]: cancelled
                  - cell "La persona canceló su propia solicitud." [ref=f30e379]
                  - cell "Selecciona otra sección cuando la app reabra el paso." [ref=f30e380]
                - row [ref=f30e381]:
                  - cell [ref=f30e382]:
                    - code [ref=f30e383]: expired
                  - cell "El plazo terminó sin decisión." [ref=f30e384]
                  - cell "La persona vuelve a solicitar si la app muestra la acción; de lo contrario, pide asistencia." [ref=f30e385]
            - paragraph [ref=f30e386]:
              - text: El plazo se configura con
              - code [ref=f30e387]: membership.pending_timeout_days
              - text: y usa
              - strong [ref=f30e388]: 8 días
              - text: cuando no existe una configuración distinta. Un proceso automático revisa cada hora los pendientes antiguos; por eso una fila puede desaparecer sin que alguien pulse aprobar o rechazar.
            - generic [ref=f30e389]:
              - heading "Limitación de auditoría" [level=2] [ref=f30e390]
              - link "Sección titulada «Limitación de auditoría»" [ref=f30e391] [cursor=pointer]:
                - /url: "#limitación-de-auditoría"
            - paragraph [ref=f30e396]:
              - text: La asignación guarda el estado, el motivo de rechazo y actualiza
              - code [ref=f30e397]: modified_at
              - text: "al decidir. Esa marca conserva la hora de la última modificación, pero no demuestra por sí sola qué operación ocurrió ni quién la realizó: el modelo no persiste al actor ni campos semánticos"
              - code [ref=f30e398]: approved_at
              - text: o
              - code [ref=f30e399]: rejected_at
              - text: . No uses esta bandeja como única evidencia de autoría; si el procedimiento institucional exige trazabilidad nominal, registra el respaldo en el canal autorizado hasta que existan esos campos en SACDIA.
            - generic [ref=f30e400]:
