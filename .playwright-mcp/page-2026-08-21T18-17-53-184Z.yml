      - main [ref=f6e234]:
        - heading "Solicitudes de membresía" [level=1] [ref=f6e237]
        - generic [ref=f6e239]:
          - generic [ref=f6e240]:
            - paragraph [ref=f6e241]: Esta bandeja corresponde únicamente a las solicitudes de ingreso como miembro. Las solicitudes de cargos y los traslados siguen recorridos separados.
            - generic [ref=f6e242]:
              - heading "Resultado esperado" [level=2] [ref=f6e243]
              - link "Sección titulada «Resultado esperado»" [ref=f6e244] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f6e249]: Podrás revisar la sección correcta, decidir una solicitud pendiente y confirmar que desapareció de la cola sin duplicar asignaciones.
            - generic [ref=f6e250]:
              - heading "Acceso requerido" [level=2] [ref=f6e251]
              - link "Sección titulada «Acceso requerido»" [ref=f6e252] [cursor=pointer]:
                - /url: "#acceso-requerido"
            - list [ref=f6e257]:
              - listitem [ref=f6e258]: Sesión válida en el panel administrativo.
              - listitem [ref=f6e259]:
                - text: Permiso
                - code [ref=f6e260]: club_members:approve
                - text: dentro de la sección que vas a revisar.
            - paragraph [ref=f6e261]: El backend valida el permiso y el alcance de cada decisión. Abrir la ruta no concede acceso a secciones fuera del cargo activo.
            - generic [ref=f6e262]:
              - heading "Ruta incluida" [level=2] [ref=f6e263]
              - link "Sección titulada «Ruta incluida»" [ref=f6e264] [cursor=pointer]:
                - /url: "#ruta-incluida"
            - paragraph [ref=f6e269]:
              - code [ref=f6e270]: /dashboard/requests/membership
            - generic [ref=f6e271]:
              - heading "Reconoce la pantalla" [level=2] [ref=f6e272]
              - link "Sección titulada «Reconoce la pantalla»" [ref=f6e273] [cursor=pointer]:
                - /url: "#reconoce-la-pantalla"
            - figure "Confirma la sección antes de decidir; la bandeja contiene solo solicitudes pendientes y activas del contexto elegido." [ref=f6e278]:
              - img "Panel de Solicitudes de Membresía con selector de sección, contador de pendientes y botón Actualizar" [ref=f6e279]
            - generic [ref=f6e281]:
              - heading "Seleccionar la sección" [level=2] [ref=f6e282]
              - link "Sección titulada «Seleccionar la sección»" [ref=f6e283] [cursor=pointer]:
                - /url: "#seleccionar-la-sección"
            - list [ref=f6e288]:
              - listitem [ref=f6e289]:
                - text: Abre
                - strong [ref=f6e290]: Solicitudes → Membresía
                - text: .
              - listitem [ref=f6e291]:
                - text: Revisa el selector
                - strong [ref=f6e292]: Sección del club
                - text: antes de utilizar la tabla.
              - listitem [ref=f6e293]: El panel selecciona inicialmente la primera sección disponible; no supongas que es la que vas a operar.
              - listitem [ref=f6e294]:
                - text: Elige la opción identificada por
                - strong [ref=f6e295]: Club · Tipo de sección
                - text: .
              - listitem [ref=f6e296]: Espera a que el contador y la tabla terminen de actualizarse.
            - paragraph [ref=f6e297]: Si aparece un error de permisos, confirma tu cargo y el contexto. No intentes resolverlo cambiando manualmente el identificador de la URL.
            - generic [ref=f6e298]:
              - heading "Revisar antes de decidir" [level=2] [ref=f6e299]
              - link "Sección titulada «Revisar antes de decidir»" [ref=f6e300] [cursor=pointer]:
                - /url: "#revisar-antes-de-decidir"
            - paragraph [ref=f6e305]:
              - text: La cola muestra únicamente asignaciones
              - code [ref=f6e306]: pending
              - text: "y activas, ordenadas desde la solicitud más antigua. Antes de actuar, verifica:"
            - list [ref=f6e307]:
              - listitem [ref=f6e308]: nombre y correo de la persona;
              - listitem [ref=f6e309]: cargo solicitado, normalmente miembro;
              - listitem [ref=f6e310]: fecha en que se creó la solicitud;
              - listitem [ref=f6e311]: fecha y hora de vencimiento;
              - listitem [ref=f6e312]: club y sección seleccionados en el filtro.
            - paragraph [ref=f6e313]:
              - text: Un icono de reloj resalta las solicitudes que vencen en menos de
              - strong [ref=f6e314]: 48 horas
              - text: . Priorízalas, pero no apruebes sin confirmar la identidad y la sección.
            - generic [ref=f6e315]:
              - heading "Aprobar" [level=2] [ref=f6e316]
              - link "Sección titulada «Aprobar»" [ref=f6e317] [cursor=pointer]:
                - /url: "#aprobar"
            - list [ref=f6e322]:
              - listitem [ref=f6e323]: Revisa toda la fila.
              - listitem [ref=f6e324]: Pulsa el icono de aprobación una sola vez.
              - listitem [ref=f6e325]: Espera el mensaje de confirmación y la actualización automática de la tabla.
              - listitem [ref=f6e326]: Confirma que la persona ya no aparece en pendientes.
            - paragraph [ref=f6e327]:
              - text: "La aprobación no abre un diálogo de confirmación: el clic envía la decisión inmediatamente. El estado cambia a"
              - code [ref=f6e328]: active
              - text: ", se elimina la fecha de vencimiento y se invalida el contexto de autorización para que la app reciba los permisos del cargo."
            - generic [ref=f6e329]:
              - heading "Rechazar" [level=2] [ref=f6e330]
              - link "Sección titulada «Rechazar»" [ref=f6e331] [cursor=pointer]:
                - /url: "#rechazar"
            - list [ref=f6e336]:
              - listitem [ref=f6e337]: Pulsa el icono de rechazo.
              - listitem [ref=f6e338]: Revisa nuevamente el nombre mostrado en el diálogo.
              - listitem [ref=f6e339]:
                - text: Escribe una razón clara cuando ayude a la persona a corregir la solicitud. El
                - strong [ref=f6e340]: motivo es opcional
                - text: y admite hasta 500 caracteres.
              - listitem [ref=f6e341]:
                - text: Pulsa
                - strong [ref=f6e342]: Rechazar
                - text: y espera la confirmación.
              - listitem [ref=f6e343]: Comprueba que la fila desapareció de la cola.
            - paragraph [ref=f6e344]:
              - text: El estado cambia a
              - code [ref=f6e345]: rejected
              - text: y la app puede mostrar la razón capturada. No incluyas datos médicos, contraseñas ni información que no sea necesaria para corregir el ingreso.
            - generic [ref=f6e346]:
              - heading "Estados y vencimiento" [level=2] [ref=f6e347]
              - link "Sección titulada «Estados y vencimiento»" [ref=f6e348] [cursor=pointer]:
                - /url: "#estados-y-vencimiento"
            - table [ref=f6e353]:
              - rowgroup [ref=f6e354]:
                - row [ref=f6e355]:
                  - columnheader "Estado" [ref=f6e356]
                  - columnheader "Significado" [ref=f6e357]
                  - columnheader "Siguiente acción" [ref=f6e358]
              - rowgroup [ref=f6e359]:
                - row [ref=f6e360]:
                  - cell [ref=f6e361]:
                    - code [ref=f6e362]: pending
                  - cell "La persona terminó el post-registro y espera decisión." [ref=f6e363]
                  - cell "Aprobar o rechazar dentro del plazo." [ref=f6e364]
                - row [ref=f6e365]:
                  - cell [ref=f6e366]:
                    - code [ref=f6e367]: active
                  - cell "La sección aprobó la membresía." [ref=f6e368]
                  - cell "La persona ya puede operar según su cargo." [ref=f6e369]
                - row [ref=f6e370]:
                  - cell [ref=f6e371]:
                    - code [ref=f6e372]: rejected
                  - cell "La solicitud fue rechazada." [ref=f6e373]
                  - cell "La persona corrige y vuelve a solicitar con la misma cuenta." [ref=f6e374]
                - row [ref=f6e375]:
                  - cell [ref=f6e376]:
                    - code [ref=f6e377]: cancelled
                  - cell "La persona canceló su propia solicitud." [ref=f6e378]
                  - cell "Selecciona otra sección desde la app." [ref=f6e379]
                - row [ref=f6e380]:
                  - cell [ref=f6e381]:
                    - code [ref=f6e382]: expired
                  - cell "El plazo terminó sin decisión." [ref=f6e383]
                  - cell "La persona vuelve a solicitar desde la app." [ref=f6e384]
            - paragraph [ref=f6e385]:
              - text: El plazo se configura con
              - code [ref=f6e386]: membership.pending_timeout_days
              - text: y usa
              - strong [ref=f6e387]: 8 días
              - text: cuando no existe una configuración distinta. Un proceso automático revisa cada hora los pendientes antiguos; por eso una fila puede desaparecer sin que alguien pulse aprobar o rechazar.
