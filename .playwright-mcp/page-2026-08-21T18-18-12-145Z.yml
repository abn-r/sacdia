            - paragraph [ref=f12e201]:
              - text: Pulsa
              - strong [ref=f12e202]: Actualizar
              - text: y confirma que la solicitud ya no aparece en la sección. La persona debe refrescar o volver a entrar en la app para recibir el estado nuevo.
