            - generic [ref=f12e68]:
              - heading "Reconoce la pantalla" [level=2] [ref=f12e69]
              - link "Sección titulada «Reconoce la pantalla»" [ref=f12e70] [cursor=pointer]:
                - /url: "#reconoce-la-pantalla"
            - figure "Confirma la sección antes de decidir; la bandeja contiene solo solicitudes pendientes y activas del contexto elegido." [ref=f12e75]:
              - img "Panel de Solicitudes de Membresía con selector de sección, contador de pendientes y botón Actualizar" [ref=f12e76]
            - generic [ref=f12e78]:
              - heading "Seleccionar la sección" [level=2] [ref=f12e79]
              - link "Sección titulada «Seleccionar la sección»" [ref=f12e80] [cursor=pointer]:
                - /url: "#seleccionar-la-sección"
            - list [ref=f12e85]:
              - listitem [ref=f12e86]:
                - text: Abre
                - strong [ref=f12e87]: Solicitudes → Membresía
                - text: .
              - listitem [ref=f12e88]:
                - text: Revisa el selector
                - strong [ref=f12e89]: Sección del club
                - text: antes de utilizar la tabla.
              - listitem [ref=f12e90]: El panel selecciona inicialmente la primera sección disponible; no supongas que es la que vas a operar.
              - listitem [ref=f12e91]:
                - text: Elige la opción identificada por
                - strong [ref=f12e92]: Club · Tipo de sección
                - text: .
              - listitem [ref=f12e93]: Espera a que el contador y la tabla terminen de actualizarse.
            - paragraph [ref=f12e94]: Si aparece un error de permisos, confirma tu cargo y el contexto. No intentes resolverlo cambiando manualmente el identificador de la URL.
            - generic [ref=f12e95]:
              - heading "Revisar antes de decidir" [level=2] [ref=f12e96]
              - link "Sección titulada «Revisar antes de decidir»" [ref=f12e97] [cursor=pointer]:
                - /url: "#revisar-antes-de-decidir"
            - paragraph [ref=f12e102]:
              - text: La cola muestra únicamente asignaciones
              - code [ref=f12e103]: pending
              - text: "y activas, ordenadas desde la solicitud más antigua. Antes de actuar, verifica:"
            - list [ref=f12e104]:
              - listitem [ref=f12e105]: nombre y correo de la persona;
              - listitem [ref=f12e106]: cargo solicitado, normalmente miembro;
              - listitem [ref=f12e107]: fecha en que se creó la solicitud;
              - listitem [ref=f12e108]: fecha y hora de vencimiento;
              - listitem [ref=f12e109]: club y sección seleccionados en el filtro.
            - paragraph [ref=f12e110]:
              - text: Un icono de reloj resalta las solicitudes que vencen en menos de
              - strong [ref=f12e111]: 48 horas
              - text: . Priorízalas, pero no apruebes sin confirmar la identidad y la sección.
            - generic [ref=f12e112]:
              - heading "Aprobar" [level=2] [ref=f12e113]
              - link "Sección titulada «Aprobar»" [ref=f12e114] [cursor=pointer]:
                - /url: "#aprobar"
            - list [ref=f12e119]:
              - listitem [ref=f12e120]: Revisa toda la fila.
              - listitem [ref=f12e121]: Pulsa el icono de aprobación una sola vez.
              - listitem [ref=f12e122]: Espera el mensaje de confirmación y la actualización automática de la tabla.
              - listitem [ref=f12e123]: Confirma que la persona ya no aparece en pendientes.
            - paragraph [ref=f12e124]:
              - text: "La aprobación no abre un diálogo de confirmación: el clic envía la decisión inmediatamente. El estado cambia a"
              - code [ref=f12e125]: active
              - text: ", se elimina la fecha de vencimiento y se invalida el contexto de autorización para que la app reciba los permisos del cargo."
            - generic [ref=f12e126]:
              - heading "Rechazar" [level=2] [ref=f12e127]
              - link "Sección titulada «Rechazar»" [ref=f12e128] [cursor=pointer]:
                - /url: "#rechazar"
            - list [ref=f12e133]:
              - listitem [ref=f12e134]: Pulsa el icono de rechazo.
              - listitem [ref=f12e135]: Revisa nuevamente el nombre mostrado en el diálogo.
              - listitem [ref=f12e136]:
                - text: Escribe una razón clara cuando ayude a la persona a corregir la solicitud. El
                - strong [ref=f12e137]: motivo es opcional
                - text: y admite hasta 500 caracteres.
              - listitem [ref=f12e138]:
                - text: Pulsa
                - strong [ref=f12e139]: Rechazar
                - text: y espera la confirmación.
              - listitem [ref=f12e140]: Comprueba que la fila desapareció de la cola.
            - paragraph [ref=f12e141]:
              - text: El estado cambia a
              - code [ref=f12e142]: rejected
              - text: y la app puede mostrar la razón capturada. No incluyas datos médicos, contraseñas ni información que no sea necesaria para corregir el ingreso.
            - generic [ref=f12e143]:
              - heading "Estados y vencimiento" [level=2] [ref=f12e144]
              - link "Sección titulada «Estados y vencimiento»" [ref=f12e145] [cursor=pointer]:
                - /url: "#estados-y-vencimiento"
