        - heading "Solicitudes de membresía" [level=1] [ref=f12e34]
        - generic [ref=f12e36]:
          - generic [ref=f12e37]:
            - paragraph [ref=f12e38]: Esta bandeja corresponde únicamente a las solicitudes de ingreso como miembro. Las solicitudes de cargos y los traslados siguen recorridos separados.
            - generic [ref=f12e39]:
              - heading "Resultado esperado" [level=2] [ref=f12e40]
              - link "Sección titulada «Resultado esperado»" [ref=f12e41] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f12e46]: Podrás revisar la sección correcta, decidir una solicitud pendiente y confirmar que desapareció de la cola sin duplicar asignaciones.
            - generic [ref=f12e47]:
              - heading "Acceso requerido" [level=2] [ref=f12e48]
              - link "Sección titulada «Acceso requerido»" [ref=f12e49] [cursor=pointer]:
                - /url: "#acceso-requerido"
            - list [ref=f12e54]:
              - listitem [ref=f12e55]: Sesión válida en el panel administrativo.
              - listitem [ref=f12e56]:
                - text: Permiso
                - code [ref=f12e57]: club_members:approve
                - text: dentro de la sección que vas a revisar.
            - paragraph [ref=f12e58]: El backend valida el permiso y el alcance de cada decisión. Abrir la ruta no concede acceso a secciones fuera del cargo activo.
            - generic [ref=f12e59]:
              - heading "Ruta incluida" [level=2] [ref=f12e60]
