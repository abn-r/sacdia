                  - cell "El plazo terminó sin decisión." [ref=f12e180]
                  - cell "La persona vuelve a solicitar desde la app." [ref=f12e181]
            - paragraph [ref=f12e182]:
              - text: El plazo se configura con
              - code [ref=f12e183]: membership.pending_timeout_days
              - text: y usa
              - strong [ref=f12e184]: 8 días
              - text: cuando no existe una configuración distinta. Un proceso automático revisa cada hora los pendientes antiguos; por eso una fila puede desaparecer sin que alguien pulse aprobar o rechazar.
            - generic [ref=f12e185]:
              - heading "Limitación de auditoría" [level=2] [ref=f12e186]
              - link "Sección titulada «Limitación de auditoría»" [ref=f12e187] [cursor=pointer]:
                - /url: "#limitación-de-auditoría"
            - paragraph [ref=f12e192]:
              - text: La asignación guarda el estado y el motivo de rechazo, pero el modelo actual
              - strong [ref=f12e193]: no registra quién aprobó o rechazó ni la hora específica de esa decisión
              - text: . No uses esta bandeja como única evidencia de autoría; si el procedimiento institucional exige trazabilidad nominal, registra el respaldo en el canal autorizado hasta que exista ese campo en SACDIA.
            - generic [ref=f12e194]:
              - heading "Cómo verificarlo" [level=2] [ref=f12e195]
              - link "Sección titulada «Cómo verificarlo»" [ref=f12e196] [cursor=pointer]:
