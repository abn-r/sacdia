      - main [ref=f1e236]:
        - heading "Solicitudes de membresía" [level=1] [ref=f1e239]
        - generic [ref=f1e241]:
          - generic [ref=f1e242]:
            - paragraph [ref=f1e243]: Esta bandeja corresponde únicamente a las solicitudes de ingreso como miembro. Las solicitudes de cargos y los traslados siguen recorridos separados.
            - generic [ref=f1e244]:
              - heading "Resultado esperado" [level=2] [ref=f1e245]
              - link "Sección titulada «Resultado esperado»" [ref=f1e246] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f1e251]: Podrás revisar la sección correcta, decidir una solicitud pendiente y confirmar que desapareció de la cola sin duplicar asignaciones.
            - generic [ref=f1e252]:
              - heading "Acceso requerido" [level=2] [ref=f1e253]
              - link "Sección titulada «Acceso requerido»" [ref=f1e254] [cursor=pointer]:
                - /url: "#acceso-requerido"
            - list [ref=f1e259]:
              - listitem [ref=f1e260]: Sesión válida y un rol admitido en el panel administrativo.
              - listitem [ref=f1e261]:
                - text: Permiso
                - code [ref=f1e262]: club_members:approve
                - text: dentro de la sección que vas a revisar.
            - paragraph [ref=f1e263]:
              - text: "Los cargos de club no obtienen acceso al panel solo por su cargo: deben revisar desde"
              - strong [ref=f1e264]: Miembros → Solicitudes
              - text: en la app cuando esa superficie muestre la acción. El backend valida el permiso y el alcance de cada decisión. Abrir la ruta no concede acceso a secciones fuera del cargo activo.
            - generic [ref=f1e265]:
              - heading "Ruta incluida" [level=2] [ref=f1e266]
              - link "Sección titulada «Ruta incluida»" [ref=f1e267] [cursor=pointer]:
                - /url: "#ruta-incluida"
            - paragraph [ref=f1e272]:
              - code [ref=f1e273]: /dashboard/requests/membership
            - generic [ref=f1e274]:
              - heading "Reconoce la pantalla" [level=2] [ref=f1e275]
              - link "Sección titulada «Reconoce la pantalla»" [ref=f1e276] [cursor=pointer]:
                - /url: "#reconoce-la-pantalla"
            - figure "Confirma la sección antes de decidir; la bandeja contiene solo solicitudes en estado pending y con la asignación activa dentro del contexto elegido." [ref=f1e281]:
              - img "Panel de Solicitudes de Membresía con selector de sección, contador de pendientes y botón Actualizar" [ref=f1e282]
            - generic [ref=f1e284]:
              - heading "Seleccionar la sección" [level=2] [ref=f1e285]
              - link "Sección titulada «Seleccionar la sección»" [ref=f1e286] [cursor=pointer]:
                - /url: "#seleccionar-la-sección"
            - list [ref=f1e291]:
              - listitem [ref=f1e292]:
                - text: Abre
                - strong [ref=f1e293]: Solicitudes → Membresía
                - text: .
              - listitem [ref=f1e294]:
                - text: Revisa el selector
                - strong [ref=f1e295]: Sección del club
                - text: antes de utilizar la tabla.
              - listitem [ref=f1e296]: El panel selecciona inicialmente la primera sección disponible; no supongas que es la que vas a operar.
              - listitem [ref=f1e297]:
                - text: Elige la opción identificada por
                - strong [ref=f1e298]: Club · Tipo de sección
                - text: .
              - listitem [ref=f1e299]: Espera a que el contador y la tabla terminen de actualizarse.
            - paragraph [ref=f1e300]: Si aparece un error de permisos, confirma tu cargo y el contexto. No intentes resolverlo cambiando manualmente el identificador de la URL.
            - generic [ref=f1e301]:
              - heading "Revisar antes de decidir" [level=2] [ref=f1e302]
              - link "Sección titulada «Revisar antes de decidir»" [ref=f1e303] [cursor=pointer]:
                - /url: "#revisar-antes-de-decidir"
            - paragraph [ref=f1e308]:
              - text: La cola muestra únicamente asignaciones en estado
              - code [ref=f1e309]: pending
              - text: y con la bandera
              - code [ref=f1e310]: "active: true"
              - text: ", ordenadas desde la solicitud más antigua. Aquí"
              - code [ref=f1e311]: active
              - text: "describe la vigencia del registro, no el estado aprobado de la membresía. Antes de actuar, verifica:"
            - list [ref=f1e312]:
              - listitem [ref=f1e313]: nombre y correo de la persona;
              - listitem [ref=f1e314]: cargo solicitado, normalmente miembro;
              - listitem [ref=f1e315]: fecha en que se creó la solicitud;
              - listitem [ref=f1e316]: fecha y hora de vencimiento;
              - listitem [ref=f1e317]: club y sección seleccionados en el filtro.
            - paragraph [ref=f1e318]:
              - text: Un icono de reloj resalta las solicitudes que vencen en menos de
              - strong [ref=f1e319]: 48 horas
              - text: . Priorízalas, pero no apruebes sin confirmar la identidad y la sección.
            - generic [ref=f1e320]:
              - heading "Aprobar" [level=2] [ref=f1e321]
              - link "Sección titulada «Aprobar»" [ref=f1e322] [cursor=pointer]:
                - /url: "#aprobar"
            - list [ref=f1e327]:
              - listitem [ref=f1e328]: Revisa toda la fila.
              - listitem [ref=f1e329]: Pulsa el icono de aprobación una sola vez.
              - listitem [ref=f1e330]: Espera el mensaje de confirmación y la actualización automática de la tabla.
              - listitem [ref=f1e331]: Confirma que la persona ya no aparece en pendientes.
            - paragraph [ref=f1e332]:
              - text: "La aprobación no abre un diálogo de confirmación: el clic envía la decisión inmediatamente. El estado cambia a"
              - code [ref=f1e333]: active
              - text: ", se elimina la fecha de vencimiento y se invalida el contexto de autorización para que la app reciba los permisos del cargo."
            - generic [ref=f1e334]:
              - heading "Rechazar" [level=2] [ref=f1e335]
              - link "Sección titulada «Rechazar»" [ref=f1e336] [cursor=pointer]:
                - /url: "#rechazar"
            - list [ref=f1e341]:
              - listitem [ref=f1e342]: Pulsa el icono de rechazo.
              - listitem [ref=f1e343]: Revisa nuevamente el nombre mostrado en el diálogo.
              - listitem [ref=f1e344]:
                - text: Escribe una razón clara cuando ayude a la persona a corregir la solicitud. El
                - strong [ref=f1e345]: motivo es opcional
                - text: y admite hasta 500 caracteres.
              - listitem [ref=f1e346]:
                - text: Pulsa
                - strong [ref=f1e347]: Rechazar
                - text: y espera la confirmación.
              - listitem [ref=f1e348]: Comprueba que la fila desapareció de la cola.
            - paragraph [ref=f1e349]:
              - text: El estado cambia a
              - code [ref=f1e350]: rejected
              - text: y la app puede mostrar la razón capturada. No incluyas datos médicos, contraseñas ni información que no sea necesaria para corregir el ingreso.
            - generic [ref=f1e351]:
              - heading "Estados y vencimiento" [level=2] [ref=f1e352]
              - link "Sección titulada «Estados y vencimiento»" [ref=f1e353] [cursor=pointer]:
                - /url: "#estados-y-vencimiento"
            - table [ref=f1e358]:
              - rowgroup [ref=f1e359]:
