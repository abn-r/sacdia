            - paragraph [ref=f1e402]:
              - text: Si
              - code [ref=f1e403]: membership.pending_timeout_days
              - text: "se configura con un valor distinto de 8, la fecha visible y el vencimiento automático pueden divergir: el proceso no consulta"
              - code [ref=f1e404]: expires_at
