      - main [ref=f26e215]:
        - heading "Completar el perfil inicial" [level=1] [ref=f26e218]
        - generic [ref=f26e220]:
          - generic [ref=f26e221]:
            - paragraph [ref=f26e222]: El post-registro aparece después de crear una cuenta o al iniciar sesión con un perfil incompleto. La app retoma automáticamente el primer paso pendiente.
            - generic [ref=f26e223]:
              - heading "Resultado esperado" [level=2] [ref=f26e224]
              - link "Sección titulada «Resultado esperado»" [ref=f26e225] [cursor=pointer]:
                - /url: "#resultado-esperado"
            - paragraph [ref=f26e230]: Tendrás una foto, datos personales suficientes, al menos un contacto de emergencia y una solicitud de membresía vinculada al club y sección correctos.
            - generic [ref=f26e231]:
              - heading "Quién puede utilizarlo" [level=2] [ref=f26e232]
              - link "Sección titulada «Quién puede utilizarlo»" [ref=f26e233] [cursor=pointer]:
                - /url: "#quién-puede-utilizarlo"
            - paragraph [ref=f26e238]: Usuarios autenticados cuyo post-registro todavía no está completo. Cada persona completa su propia información; un cargo administrativo no debe reemplazar este recorrido salvo una corrección autorizada.
            - generic [ref=f26e239]:
              - heading "Antes de comenzar" [level=2] [ref=f26e240]
              - link "Sección titulada «Antes de comenzar»" [ref=f26e241] [cursor=pointer]:
                - /url: "#antes-de-comenzar"
            - list [ref=f26e246]:
              - listitem [ref=f26e247]: Ten disponible una foto clara o permiso para usar la cámara.
              - listitem [ref=f26e248]: Confirma fecha de nacimiento, estado de bautismo y datos de un contacto de emergencia.
              - listitem [ref=f26e249]: Si eres menor de 18 años, prepara la información del representante legal.
              - listitem [ref=f26e250]: Identifica país, unión, campo local y club antes de elegir la sección.
            - generic [ref=f26e251]:
              - 'heading "Paso 1: foto" [level=2] [ref=f26e252]'
              - 'link "Sección titulada «Paso 1: foto»" [ref=f26e253] [cursor=pointer]':
                - /url: "#paso-1-foto"
            - list [ref=f26e258]:
              - listitem [ref=f26e259]:
                - text: Elige
                - strong [ref=f26e260]: Tomar foto
                - text: o
                - strong [ref=f26e261]: Seleccionar de galería
                - text: .
              - listitem [ref=f26e262]: Ajusta el recorte cuadrado y confirma.
              - listitem [ref=f26e263]: Espera a que termine la carga.
              - listitem [ref=f26e264]:
                - text: Pulsa
                - strong [ref=f26e265]: Siguiente
                - text: cuando el botón quede habilitado.
            - paragraph [ref=f26e266]: La interfaz vigente exige una foto para completar este paso. No cierres la pantalla mientras se está cargando; si falla, vuelve a seleccionarla y espera la confirmación.
            - generic [ref=f26e267]:
              - 'heading "Paso 2: datos personales y contactos" [level=2] [ref=f26e268]'
              - 'link "Sección titulada «Paso 2: datos personales y contactos»" [ref=f26e269] [cursor=pointer]':
                - /url: "#paso-2-datos-personales-y-contactos"
            - paragraph [ref=f26e274]: "Completa primero los datos que bloquean el avance:"
            - list [ref=f26e275]:
              - listitem [ref=f26e276]: género;
              - listitem [ref=f26e277]: fecha de nacimiento;
              - listitem [ref=f26e278]:
                - text: bautismo en
                - strong [ref=f26e279]: Sí
                - text: o
                - strong [ref=f26e280]: "No"
                - text: ;
              - listitem [ref=f26e281]:
                - text: fecha de bautismo cuando elegiste
                - strong [ref=f26e282]: Sí
                - text: ;
              - listitem [ref=f26e283]: por lo menos un contacto de emergencia activo;
              - listitem [ref=f26e284]: representante legal cuando el sistema determina que eres menor de 18 años.
            - paragraph [ref=f26e285]: El tipo de sangre se puede registrar en el mismo paso, pero no bloquea el botón. La app permite hasta cinco contactos de emergencia; evita registrar a la misma persona varias veces.
            - generic [ref=f26e286]:
              - heading "Declarar salud sin ambigüedad" [level=2] [ref=f26e287]
              - link "Sección titulada «Declarar salud sin ambigüedad»" [ref=f26e288] [cursor=pointer]:
                - /url: "#declarar-salud-sin-ambigüedad"
            - paragraph [ref=f26e293]:
              - text: Revisa por separado
              - strong [ref=f26e294]: Alergias
              - text: ","
              - strong [ref=f26e295]: Enfermedades
              - text: "y"
              - strong [ref=f26e296]: Medicamentos
              - text: ":"
            - list [ref=f26e297]:
              - listitem [ref=f26e298]: Si tienes registros, abre cada catálogo y selecciona los correspondientes.
              - listitem [ref=f26e299]:
                - text: Si no tienes ninguno, marca explícitamente la opción
                - strong [ref=f26e300]: No tengo
                - text: de esa categoría.
              - listitem [ref=f26e301]: "No dejes una categoría vacía por olvido: una lista vacía no distingue por sí sola entre “sin información” y “sin padecimientos”."
              - listitem [ref=f26e302]: Antes de continuar, vuelve a la pantalla principal y confirma los contadores.
            - paragraph [ref=f26e303]: Estas declaraciones ayudan a la operación segura del club. La validación técnica del paso se concentra en los datos personales, el contacto y el representante, por lo que debes revisar salud aunque el botón ya esté habilitado.
            - generic [ref=f26e304]:
              - 'heading "Paso 3: club, sección y clase" [level=2] [ref=f26e305]'
              - 'link "Sección titulada «Paso 3: club, sección y clase»" [ref=f26e306] [cursor=pointer]':
                - /url: "#paso-3-club-sección-y-clase"
            - list [ref=f26e311]:
              - listitem [ref=f26e312]:
                - text: Selecciona
                - strong [ref=f26e313]: País
                - text: .
              - listitem [ref=f26e314]:
                - text: Selecciona la
                - strong [ref=f26e315]: Unión
                - text: disponible para ese país.
              - listitem [ref=f26e316]:
                - text: Selecciona el
