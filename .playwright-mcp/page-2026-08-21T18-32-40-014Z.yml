                - text: .
              - listitem [ref=f26e318]:
                - text: Elige el
                - strong [ref=f26e319]: Club
                - text: correcto.
              - listitem [ref=f26e320]:
                - text: Revisa la
                - strong [ref=f26e321]: Sección
                - text: recomendada según tu edad.
              - listitem [ref=f26e322]:
                - text: Confirma la clase progresiva mostrada y pulsa
                - strong [ref=f26e323]: Finalizar
                - text: .
            - paragraph [ref=f26e324]: Cuando solo hay una opción, la app puede seleccionarla automáticamente. La sección, el tipo de club y la clase se derivan de la fecha de nacimiento y de los catálogos; el backend vuelve a calcular la clase al guardar, por lo que no debes intentar forzar otra desde la interfaz.
            - paragraph [ref=f26e325]: "Al finalizar ocurren dos cosas distintas dentro de la misma operación:"
            - list [ref=f26e326]:
              - listitem [ref=f26e327]:
                - text: se crea o reactiva la
                - strong [ref=f26e328]: inscripción anual
                - text: de la clase correspondiente;
              - listitem [ref=f26e329]:
                - text: se crea la asignación de miembro en estado
                - code [ref=f26e330]: pending
                - text: para que la sección la revise.
            - paragraph [ref=f26e331]:
              - text: La solicitud recibe una fecha de vencimiento de
              - strong [ref=f26e332]: 8 días
              - text: . Completar el perfil no equivale todavía a tener una membresía activa.
            - generic [ref=f26e333]:
              - heading "Mientras la solicitud está pendiente" [level=2] [ref=f26e334]
              - link "Sección titulada «Mientras la solicitud está pendiente»" [ref=f26e335] [cursor=pointer]:
                - /url: "#mientras-la-solicitud-está-pendiente"
            - paragraph [ref=f26e340]:
              - text: La app abre el tablero y muestra el estado de espera. Mientras la asignación siga
              - code [ref=f26e341]: pending
              - text: ":"
            - list [ref=f26e342]:
              - listitem [ref=f26e343]: puedes consultar tu perfil;
              - listitem [ref=f26e344]: los accesos operativos del club permanecen ocultos;
              - listitem [ref=f26e345]: no debes crear otra cuenta ni repetir el post-registro.
            - paragraph [ref=f26e346]:
              - text: Cuando la sección aprueba, el estado cambia a
              - code [ref=f26e347]: active
              - text: y las funciones se habilitan según el cargo y los permisos de esa asignación.
            - generic [ref=f26e348]:
